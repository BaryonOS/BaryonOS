[workspace]
resolver = "2"
exclude = ["keyring-client", "heap-allocator", "examples/memory"]
members = ["runtime", "catalog-client", "document-session", "examples/catalog-read", "examples/volume-docs", "examples/supervisor", "examples/keyring", "examples/system"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
