[workspace]
resolver = "2"
exclude = ["keyring-client", "heap-allocator", "examples/memory", "display-client", "examples/display-input-probe", "examples/input-service", "examples/random-probe", "examples/image-probe"]
members = ["keyring-random-client", "runtime", "catalog-client", "document-session", "examples/catalog-read", "examples/volume-docs", "examples/supervisor", "examples/keyring", "examples/update", "examples/system"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
