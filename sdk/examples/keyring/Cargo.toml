[package]
name = "nieuw-os-keyring-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native = []

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }
keyring-core = { path = "../../../services/keyring" }

[[bin]]
name = "keyring-service"
