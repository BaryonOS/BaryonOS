[package]
name = "nieuw-os-native-display-input-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["."]
resolver = "2"

[features]
native = []

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }
nieuw-os-display-client = { path = "../../display-client" }

[dev-dependencies]
capability-core = { path = "../../../crates/capability-core" }

[[bin]]
name = "display-probe"
path = "src/display.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "input-probe"
path = "src/input.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "display-intruder-probe"
path = "src/intruder.rs"
required-features = ["native"]
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
