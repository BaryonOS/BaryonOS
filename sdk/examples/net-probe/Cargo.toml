[package]
name = "nieuw-os-native-net-probe"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native = []

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }
nieuw-os-net-protocol = { path = "../../../services/net-protocol" }

[[bin]]
name = "net-probe"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[workspace]
members = ["."]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
