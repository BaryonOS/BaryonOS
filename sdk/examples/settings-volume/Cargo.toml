[package]
name = "nieuw-os-settings-volume-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native = ["dep:nieuw-os-sdk-runtime"]

[lib]
path = "src/lib.rs"

[dependencies]
nieuw-os-settings-core = { path = "../../settings-core" }
volume-core = { path = "../../../services/volume" }
nieuw-os-sdk-runtime = { path = "../../runtime", optional = true }

[[bin]]
name = "settings-app"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[workspace]
members = ["."]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
