[package]
name = "nieuw-os-native-image-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]

[features]
native = []

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }
nieuw-os-heap-allocator = { path = "../../heap-allocator" }
nieuw-os-image-codec = { path = "../../../services/image-codec" }

[[bin]]
name = "image-probe"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
