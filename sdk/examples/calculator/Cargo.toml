[package]
name = "nieuw-os-calculator"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
resolver = "2"

[features]
native = []
host-oracle = []

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }
nieuw-os-input-client = { path = "../../input-client" }
nieuw-os-input-core = { path = "../../../services/input-core" }
nieuw-os-surface-protocol = { path = "../../../ui/surface-protocol", features = ["client"] }
ui-core = { path = "../../../crates/ui-core" }
noto-sans-mono-bitmap = { version = "=0.3.2", default-features = false, features = ["regular", "size_16", "size_32", "unicode-basic-latin", "unicode-latin-1-supplement", "unicode-specials"] }

[dev-dependencies]
capability-core = { path = "../../../crates/capability-core" }

[[bin]]
name = "calculator-app"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "calculator-oracle"
path = "src/bin/oracle.rs"
required-features = ["host-oracle"]
test = false
bench = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
