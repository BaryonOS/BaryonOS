[package]
name = "nieuw-os-image-export"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
resolver = "2"

[features]
host-cli = []

[dependencies]
nieuw-os-image-codec = { path = "../../../services/image-codec" }

[[bin]]
name = "image-bmp"
path = "src/main.rs"
required-features = ["host-cli"]

[profile.release]
panic = "abort"
