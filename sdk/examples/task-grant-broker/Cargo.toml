[package]
name = "nieuw-os-task-grant-broker-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native = ["dep:nieuw-os-sdk-runtime"]

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime", optional = true }
nieuw-os-task-grant-core = { path = "../../task-grant-core" }
volume-core = { path = "../../../services/volume" }

[[bin]]
name = "task-grant-broker"
path = "src/broker.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "task-grant-client"
path = "src/client.rs"
required-features = ["native"]
test = false
bench = false
