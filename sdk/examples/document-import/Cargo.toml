[package]
name = "nieuw-os-document-import"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
resolver = "2"

[dependencies]
roxmltree = { version = "=0.21.2", default-features = false }
# Pin the reviewed no_std transitive search implementation as well.
memchr = { version = "=2.7.6", default-features = false }
zune-inflate = { version = "=0.2.54", default-features = false }

[features]
default = []
host-cli = []

[[bin]]
name = "docx-text"
path = "src/main.rs"
required-features = ["host-cli"]

[profile.release]
panic = "abort"
