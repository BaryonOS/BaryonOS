[package]
name = "nieuw-os-presentation"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
resolver = "2"

[features]
host-cli = []

[dependencies]
nieuw-os-graphics = { path = "../../../ui/graphics" }

[[bin]]
name = "slide-preview"
path = "src/main.rs"
required-features = ["host-cli"]

[profile.release]
panic = "abort"
