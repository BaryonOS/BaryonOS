[package]
name = "nieuw-os-ipc-wait-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
resolver = "2"

[features]
native = []

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }

[[bin]]
name = "ipc-wait-probe"
path = "src/main.rs"
required-features = ["native"]
test = false
bench = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
