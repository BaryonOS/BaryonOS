[package]
name = "nieuw-os-native-input-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace]
members = ["."]

[features]
native = []
hid-probe = ["native"]

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }
nieuw-os-input-core = { path = "../../../services/input-core" }
nieuw-os-display-client = { path = "../../display-client" }
nieuw-os-usb-core = { path = "../../../drivers/usb" }

[dev-dependencies]
capability-core = { path = "../../../crates/capability-core" }

[[bin]]
name = "input-source"
path = "src/source_main.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "input-policy"
path = "src/policy_main.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "input-hid-source"
path = "src/hid_probe_main.rs"
required-features = ["hid-probe"]
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
