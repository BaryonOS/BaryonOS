[package]
name = "nieuw-os-volume-docs-example"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native = []
# S09 portal build of volume-app, used only by the archive kernel cases.
archive-portal = []

[dependencies]
nieuw-os-sdk-runtime = { path = "../../runtime" }
volume-core = { path = "../../../services/volume" }

[[bin]]
name = "volume-service"
path = "src/service.rs"
required-features = ["native"]
test = false
bench = false

[[bin]]
name = "volume-app"
path = "src/app.rs"
required-features = ["native"]
test = false
bench = false
