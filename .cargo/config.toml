[target.x86_64-unknown-none]
linker = "rust-lld"
rustflags = [
  "-C", "code-model=small",
  "-C", "relocation-model=static",
  "-C", "no-redzone=yes",
  "-C", "link-arg=-Tkernel/linker.ld",
  "-C", "link-arg=--no-pie",
  "-C", "link-arg=--build-id=none",
  "-C", "link-arg=-zmax-page-size=0x1000",
]

# B03 signed boot: the loader verifies Ed25519 + ML-DSA-65 manifests. The
# curve25519-dalek SIMD backend both crashes rustc for this target and would
# need runtime CPU dispatch in firmware. sha2 0.11 otherwise dispatches its
# Ed25519 SHA-512 path at runtime. Pin both dependencies to portable backends.
[target.x86_64-unknown-uefi]
rustflags = [
  "--cfg", "curve25519_dalek_backend=\"serial\"",
  "--cfg", "sha2_backend=\"soft\"",
]
