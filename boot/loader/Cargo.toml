[package]
name = "os-loader"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
test-ebs-retry = []
graphics-g0 = []
# B03: verify a hybrid-signed kernel from the slot store (ADR-044).
signed-boot = ["dep:update-core"]

[dependencies]
r-efi = { version = "=7.1.0", default-features = false }
boot-protocol = { path = "../../crates/boot-protocol" }
elf-loader-core = { path = "../../crates/elf-loader-core" }
update-core = { path = "../../crates/update-core", optional = true }

[[bin]]
name = "os-loader"
path = "src/main.rs"
test = false
bench = false
