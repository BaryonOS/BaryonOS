[package]
name = "os-loader"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
test-ebs-retry = []
framebuffer = []
desktop-mode = ["framebuffer"]
desktop-hidpi = ["framebuffer"]
graphics-g0 = ["framebuffer"]
# B03: verify a hybrid-signed kernel from the slot store (ADR-049).
signed-boot = ["dep:update-core"]
# Explicit test profile; production anchors and release policy are not configured.
signed-boot-test = ["signed-boot", "update-core/test-signing-anchors"]

[dependencies]
r-efi = { version = "=7.1.0", default-features = false }
boot-protocol = { path = "../../crates/boot-protocol" }
elf-loader-core = { path = "../../crates/elf-loader-core" }
update-core = { path = "../../crates/update-core", optional = true }

[[bin]]
name = "os-loader"
path = "src/main.rs"
test = false
bench = false
