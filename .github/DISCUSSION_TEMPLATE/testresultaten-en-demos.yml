title: "[Testresultaat] "
body:
  - type: markdown
    attributes:
      value: |
        Deel reproduceerbare experimenten, testresultaten en demo's, inclusief mislukte of gedeeltelijke uitkomsten. Gebruik synthetische gegevens en geschoonde logs.
        Een discussie vervangt geen versiegebonden acceptatiebewijs in de repository. Zie de [teststrategie](https://github.com/simonvanieperen/nieuw-os/blob/main/docs/TEST-STRATEGY.md) en [volledige testrelease](https://github.com/simonvanieperen/nieuw-os/blob/main/docs/FULL-TEST-RELEASE.md). Volg voor kwetsbaarheden [SECURITY.md](https://github.com/simonvanieperen/nieuw-os/blob/main/SECURITY.md).
  - type: dropdown
    id: evidence_layer
    attributes:
      label: Bewijslaag
      description: Kies de laag waarop dit resultaat werkelijk is waargenomen.
      options:
        - Hosttest of hostprototype
        - Compilatie of artifactinspectie
        - Native uitvoering in QEMU
        - Fysieke hardware
        - Menselijke gebruikersproef of externe review
        - Ontwerp of simulatie zonder native uitvoering
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Bronversie en artifact
      description: Commit of exacte geteste bron; voeg waar relevant branch, image-ID of SHA-256 toe. Benoem ontbrekende versiegegevens expliciet.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Opstelling en herhalen
      description: Exacte commando's of bedieningsstappen, testinputs en relevante versies/profielen. Bij QEMU horen machine, CPU, accelerator, firmware en schijfconditie erbij; een bestaand configuratierapport mag deze gegevens leveren.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Verwacht, waargenomen en bewijs
      description: Wat moest gebeuren en wat gebeurde er werkelijk? Noem exitstatus of fout/timeout, geslaagde en mislukte gevallen en links naar CI-run, rapport, log, screenshot of video. Geef alleen relevante geschoonde fragmenten.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Bewijsgrens en vervolg
      description: Welke aannames, niet-uitgevoerde controles of integratiestappen blijven open? Verwijs zo mogelijk naar bestaande issues en FR-/rubric-ID's; een deelproef sluit niet automatisch een criterium.
    validations:
      required: true
