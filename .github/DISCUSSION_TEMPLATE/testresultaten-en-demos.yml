title: "[Test result] "
body:
  - type: markdown
    attributes:
      value: |
        Share reproducible experiments, test results, and demos, including
        failed or partial results. Use synthetic data and sanitised logs.
        A discussion does not replace revision-bound acceptance evidence.
        See the [test strategy](https://github.com/simonvanieperen/BaryonOS/blob/main/docs/TEST-STRATEGY.md)
        and [full release test plan](https://github.com/simonvanieperen/BaryonOS/blob/main/docs/FULL-TEST-RELEASE.md).
        For vulnerabilities, follow [SECURITY.md](https://github.com/simonvanieperen/BaryonOS/blob/main/SECURITY.md).
  - type: dropdown
    id: evidence_layer
    attributes:
      label: Evidence level
      description: Select the level at which the result was actually observed.
      options:
        - Host test or host prototype
        - Build or artifact inspection
        - Native QEMU execution
        - Physical hardware
        - Human usability test or external review
        - Design or simulation without native execution
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Revision and artifact
      description: Commit or exact tested source; include branch, image ID, or SHA-256 where relevant. State missing revision information.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Setup and reproduction
      description: Exact commands or actions, test inputs, and relevant versions/profiles. For QEMU include machine, CPU, accelerator, firmware, and disk state; an existing configuration report may provide these details.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected result, observations, and evidence
      description: What should have happened, and what actually happened? Include exit codes, errors/timeouts, passing/failing cases, and accessible CI/report/log/screenshot/video links. Quote only relevant sanitised excerpts.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Evidence limitations and follow-up
      description: Which assumptions, unexecuted checks, or integration steps remain? Link existing issues and FR/rubric IDs; a partial experiment does not automatically satisfy a criterion.
