title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask a question about Baryon OS or request help with building, testing,
        or contributing. Reproducible defects belong in [Issues](https://github.com/simonvanieperen/BaryonOS/issues/new/choose).
        See the [community guide](https://github.com/simonvanieperen/BaryonOS/blob/main/docs/COMMUNITY.md).
        Do not share secrets, personal data, or exploitable details; follow
        [SECURITY.md](https://github.com/simonvanieperen/BaryonOS/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Topic
      options:
        - Getting started or contributing
        - Boot, kernel, processes, and capabilities
        - Drivers and hardware
        - Storage and recovery
        - Desktop, Materiaal, and accessibility
        - Networking, NAS, and multiple devices
        - Apps and SDK
        - Privacy, key management, and updates
        - Local AI or quantum research
        - Build, CI, and test evidence
        - Documentation or unknown
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to understand or achieve, and what is preventing progress?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: If applicable, include a source link or commit, host/VM, feature profile, and commands used. Distinguish host prototype, build, and native execution.
  - type: textarea
    id: attempted
    attributes:
      label: Already read or tried
      description: Link relevant documentation or discussions and describe your attempts and results. A short sanitised error helps.
