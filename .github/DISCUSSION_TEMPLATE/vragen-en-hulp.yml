title: "[Vraag] "
body:
  - type: markdown
    attributes:
      value: |
        Stel hier een vraag over Nieuw OS of vraag hulp bij bouwen, testen of bijdragen. Een reproduceerbaar defect kan naar [Issues](https://github.com/simonvanieperen/nieuw-os/issues/new/choose).
        Zie de [wegwijzer](https://github.com/simonvanieperen/nieuw-os/blob/main/docs/COMMUNITY.md). Deel geen secrets, persoonlijke gegevens of exploiteerbare details; volg [SECURITY.md](https://github.com/simonvanieperen/nieuw-os/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Onderdeel
      options:
        - Beginnen of bijdragen
        - Boot, kernel, processen en capabilities
        - Drivers en hardware
        - Opslag en herstel
        - Desktop, Materiaal en toegankelijkheid
        - Netwerk, NAS en meerdere apparaten
        - Apps en SDK
        - Privacy, sleutelbeheer en updates
        - Lokale AI of quantumonderzoek
        - Build, CI en testbewijs
        - Documentatie of nog onbekend
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Je vraag
      description: Wat wil je begrijpen of bereiken, en waar loop je vast?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevante context
      description: Indien van toepassing, geef een bronlink of commit, host/VM, profiel en gebruikte commando's. Vermeld of het om een hostprototype, build of native uitvoering gaat.
  - type: textarea
    id: attempted
    attributes:
      label: Al gelezen of geprobeerd
      description: Deel relevante documentatie, eerdere discussies en de uitkomst van je eigen poging. Een korte geschoonde foutmelding helpt.
