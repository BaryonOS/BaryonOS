title: "[Gebruikservaring] "
body:
  - type: markdown
    attributes:
      value: |
        Bespreek hier dagelijkse gebruikstaken, desktopbediening, onboarding, toegankelijkheid en begrijpelijke rechten. Je hoeft geen programmeur te zijn.
        De [desktoprichting](https://github.com/simonvanieperen/nieuw-os/blob/main/docs/implementation/DESKTOP-SHELL.md) en het [privacycontract](https://github.com/simonvanieperen/nieuw-os/blob/main/docs/LOCAL-PRIVACY-CONTRACT.md) zijn het uitgangspunt. Gebruik voorbeelden zonder persoonlijke gegevens.
  - type: textarea
    id: task
    attributes:
      label: Gebruiker en taak
      description: Wie wil wat bereiken, in welke situatie? Beschrijf een gewone handeling, zoals een document terugvinden, een apparaat koppelen of met het toetsenbord werken.
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Waarop is je bijdrage gebaseerd?
      options:
        - Ontwerp of idee, nog niet uitgevoerd
        - Browserprototype
        - Native Nieuw OS in QEMU
        - Bestaande proef op fysieke hardware
        - Nog niet bekend
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Gewenste ervaring en huidige knelpunten
      description: Wat verwacht je, wat gebeurt er nu en waarom belemmert dat de taak? Neem relevante toetsenbord-, focus-, schaal-, taal- of herstelproblemen mee.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Voorstel
      description: Welke verandering zou helpen? Beschrijf ook hoe je zou merken dat de taak daarna goed lukt. Een voorstel is niet verplicht.
  - type: textarea
    id: evidence
    attributes:
      label: Voorbeelden en context
      description: Deel eventueel een schermbeeld, schets, korte stappen, versie/commit of verwante discussie. Label simulaties; een afbeelding alleen bewijst geen werkende native functie.
