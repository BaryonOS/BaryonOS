title: "[User experience] "
body:
  - type: markdown
    attributes:
      value: |
        Discuss everyday tasks, desktop interaction, onboarding, accessibility,
        and understandable permissions. Programming experience is not required.
        The [desktop specification](https://github.com/simonvanieperen/BaryonOS/blob/main/docs/implementation/DESKTOP-SHELL.md)
        and [privacy contract](https://github.com/simonvanieperen/BaryonOS/blob/main/docs/LOCAL-PRIVACY-CONTRACT.md)
        are the starting points. Use examples without personal data.
  - type: textarea
    id: task
    attributes:
      label: User and task
      description: Who is trying to achieve what? Describe an everyday action such as finding a document, pairing a device, or using the keyboard.
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: What is this based on?
      options:
        - Design or idea, not implemented
        - Browser prototype
        - Native Baryon OS in QEMU
        - Existing physical-hardware experiment
        - Unknown
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Desired experience and current obstacles
      description: What is expected, what happens now, and how does it prevent the task? Include relevant keyboard, focus, scaling, language, or recovery problems.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: What might help, and how would a successful task be recognised? A proposal is optional.
  - type: textarea
    id: evidence
    attributes:
      label: Examples and context
      description: Optionally share a screenshot, sketch, steps, version/commit, or related discussion. Label simulations; an image alone does not prove native functionality.
