title: "[Design] "
body:
  - type: markdown
    attributes:
      value: |
        Discuss technical designs before they become implementation tasks.
        A proposal does not alter an accepted contract or criterion.
        Start with the [project contracts](https://github.com/simonvanieperen/BaryonOS/blob/main/docs/COMMUNITY.md#authoritative-project-records).
        Follow [SECURITY.md](https://github.com/simonvanieperen/BaryonOS/blob/main/SECURITY.md) for vulnerability details.
  - type: textarea
    id: problem
    attributes:
      label: Problem and current state
      description: Which concrete question requires a design decision? Link current interfaces, code, or contracts and identify the revision.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and alternatives
      description: Describe the recommended approach, a viable alternative, and the main trade-offs. State what is out of scope.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Interfaces and trust boundaries
      description: Which components, authorities, data flows, or dependencies change? Preserve the independent kernel, Security Floor, and privacy contract. Explain if no boundary changes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Research and acceptance
      description: Which experiment or check can validate the choice? Distinguish host tests, builds, native QEMU, physical hardware, and human review; identify assumptions and criterion IDs.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Related evidence and work
      description: Link issues, discussions, decisions, specifications, and primary technical sources. Include versions or dates for external specifications.
