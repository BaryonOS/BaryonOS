name: Private publication history audit
permissions:
  contents: read
concurrency:
  group: private-publication-history
  cancel-in-progress: false
jobs:
  history-audit:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - unraid
    - build
    timeout-minutes: 20
    steps:
    - name: Checkout complete history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Fetch all branch, tag and pull request refs
      id: fetch-history
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/publication-askpass.sh\" <<'SH'\n\
        #!/bin/sh\ncase \"$1\" in\n  *Username*) printf '%s\\n' 'x-access-token' ;;\n\
        \  *Password*) printf '%s\\n' \"$GH_TOKEN\" ;;\n  *) exit 1 ;;\nesac\nSH\n\
        chmod 700 \"$RUNNER_TEMP/publication-askpass.sh\"\ntrap 'rm -f \"$RUNNER_TEMP/publication-askpass.sh\"\
        ' EXIT\nGIT_ASKPASS=\"$RUNNER_TEMP/publication-askpass.sh\" GIT_TERMINAL_PROMPT=0\
        \ \\\n  git -c credential.helper= fetch --force origin \\\n  '+refs/heads/*:refs/remotes/origin/*'\
        \ \\\n  '+refs/tags/*:refs/tags/*' \\\n  '+refs/pull/*/head:refs/remotes/pull/*/head'\
        \ \\\n  '+refs/pull/*/merge:refs/remotes/pull/*/merge'\ntest \"$(git rev-parse\
        \ --is-shallow-repository)\" = false\n"
    - name: Install pinned audit tools
      id: install-audit
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/publication-bin\" build/publication\n\
        curl --fail --silent --show-error --location --retry 3 \\\n  https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz\
        \ \\\n  --output \"$RUNNER_TEMP/publication-bin/gitleaks.tar.gz\"\necho \"\
        551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/publication-bin/gitleaks.tar.gz\"\
        \ | sha256sum --check --strict\ntar -xzf \"$RUNNER_TEMP/publication-bin/gitleaks.tar.gz\"\
        \ -C \"$RUNNER_TEMP/publication-bin\" gitleaks\n"
    - name: Scan complete fetched history for secrets
      if: ${{ always() && !cancelled() && steps.fetch-history.outcome == 'success'
        && steps.install-audit.outcome == 'success' }}
      shell: bash
      run: "set -euo pipefail\ntest \"$(git rev-parse --is-shallow-repository)\" =\
        \ false\nmkdir -p build/publication\nprintf '[extend]\\nuseDefault = true\\\
        n' > \"$RUNNER_TEMP/publication-gitleaks.toml\"\n: > \"$RUNNER_TEMP/publication-gitleaks.ignore\"\
        \nset +e\n\"$RUNNER_TEMP/publication-bin/gitleaks\" git . \\\n  --log-opts='--all\
        \ --full-history -m' \\\n  --config \"$RUNNER_TEMP/publication-gitleaks.toml\"\
        \ \\\n  --gitleaks-ignore-path \"$RUNNER_TEMP/publication-gitleaks.ignore\"\
        \ \\\n  --ignore-gitleaks-allow --max-archive-depth=2 --max-decode-depth=5\
        \ \\\n  --redact=100 --no-banner --no-color --exit-code=1 --timeout=600 \\\
        \n  --report-format=json --report-path \"$RUNNER_TEMP/publication-gitleaks.json\"\
        \ \\\n  > \"$RUNNER_TEMP/publication-gitleaks.log\" 2>&1\nscan_exit=$?\nset\
        \ -e\nexport PUBLICATION_SCAN_EXIT=\"$scan_exit\"\npython3 - <<'PY'\nimport\
        \ json, os, pathlib, subprocess\nraw = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'publication-gitleaks.json'\nfindings = json.loads(raw.read_text()) if\
        \ raw.is_file() else None\ncode = int(os.environ['PUBLICATION_SCAN_EXIT'])\n\
        report = {\n    'scope': 'Gitleaks default rules: all fetched branch, tag\
        \ and PR refs; merge diffs included',\n    'head': subprocess.check_output(['git',\
        \ 'rev-parse', 'HEAD'], text=True).strip(),\n    'commits': int(subprocess.check_output(['git',\
        \ 'rev-list', '--all', '--count'], text=True)),\n    'refs': len(subprocess.check_output(['git',\
        \ 'for-each-ref'], text=True).splitlines()),\n    'scanner': 'gitleaks 8.30.1',\
        \ 'exit_code': code,\n    'passed': code == 0 and findings == [],\n    'findings':\
        \ None if findings is None else [\n        {key: finding.get(key) for key\
        \ in ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint')}\n        for\
        \ finding in findings\n    ],\n    'not_scanned': ['GitHub discussions and\
        \ attachments', 'Actions logs and artifacts',\n                    'unreachable\
        \ Git objects', 'Git LFS objects',\n                    'third-party publication\
        \ rights', 'runner registration and account settings'],\n}\npathlib.Path('build/publication/history.json').write_text(json.dumps(report,\
        \ indent=2) + '\\n')\ncount = 'unknown' if findings is None else len(findings)\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:\n    summary.write(f\"\
        ### Secret scan\\nCommits: {report['commits']}; refs: {report['refs']}; findings:\
        \ {count}; passed: {report['passed']}.\\n\")\n    summary.write('Scope: fetched\
        \ Git history only; see PUBLICATION.md for the separate publication requirements.\\\
        n')\nprint('PUBLICATION_HISTORY_REPORT=' + json.dumps(report, separators=(',',\
        \ ':')))\nif not report['passed']:\n    raise SystemExit(1)\nPY\n"
    if: ${{ github.event.repository.private == true && github.event_name == 'push'
      }}
'on':
  push:
    branches:
    - audit/publication-history-20261108
