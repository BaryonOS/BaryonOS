name: Network TLS adapter quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: net-tls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  net-tls-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Rust 1.90.0
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt clippy
          rustup target add --toolchain 1.90.0 x86_64-unknown-none
      - name: Locked TLS adapter host tests
        run: cargo +1.90.0 test --locked --manifest-path services/net-tls/Cargo.toml
      - name: TLS adapter Clippy
        run: cargo +1.90.0 clippy --locked --manifest-path services/net-tls/Cargo.toml --all-targets -- -D warnings
      - name: TLS adapter formatting
        run: cargo +1.90.0 fmt --manifest-path services/net-tls/Cargo.toml --all -- --check
      - name: TLS adapter baremetal library
        run: cargo +1.90.0 build --locked --release --target x86_64-unknown-none --manifest-path services/net-tls/Cargo.toml
      - name: No generated source changes
        run: git diff --exit-code
