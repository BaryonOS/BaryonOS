name: Network TLS adapter quality

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']

permissions:
  contents: read

concurrency:
  group: net-tls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    # Phase 4 of #494 (docs/CI-CONTRACT.md "Selection"): which jobs and variants of
    # this workflow the trusted base plan needs. merge-hold verifies the result.
    name: net-tls-quality select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      narrowed: ${{ steps.jobs.outputs.narrowed }}
      run-net-tls-quality: ${{ steps.jobs.outputs.run-net-tls-quality }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the merge base never depends on a shallow clone.
          fetch-depth: 0
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Plan with the trusted base selector
        id: plan
        uses: ./.github/actions/select-ci
        with:
          event-name: ${{ github.event_name }}
          tested-sha: ${{ github.sha }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          # Empty on pull_request (the action uses the merge ref's first parent) and on dispatch.
          base-sha: ${{ github.event.merge_group.base_sha || (github.event_name == 'push' && github.event.before) || '' }}
          base-ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
      - name: Jobs and variants to run
        id: jobs
        shell: bash
        env:
          PLAN_PATH: ${{ steps.plan.outputs.plan-path }}
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          # Untrusted rendering (the checkout's copy); merge-hold alone decides.
          python3 -B tools/ci_impact.py jobs --plan="$PLAN_PATH" \
            --mode="$PLAN_MODE" --base-ref="$BASE_REF" \
            --workflow=.github/workflows/net-tls-quality.yml --tested-sha="$TESTED_SHA" | tee -a "$GITHUB_OUTPUT"

  net-tls-quality:
    needs: select
    if: ${{ needs.select.outputs.run-net-tls-quality == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      # N03-T2 H2 peer (ADR-N03-PROVIDER-20261125): Node's bundled OpenSSL 3.5+.
      - name: Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Rust 1.100.0
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none
      - name: Locked TLS adapter host tests
        run: cargo +1.100.0 test --locked --manifest-path services/net-tls/Cargo.toml
      - name: TLS adapter Clippy
        run: cargo +1.100.0 clippy --locked --manifest-path services/net-tls/Cargo.toml --all-targets -- -D warnings
      - name: TLS adapter formatting
        run: cargo +1.100.0 fmt --manifest-path services/net-tls/Cargo.toml --all -- --check
      - name: TLS adapter baremetal library
        run: cargo +1.100.0 build --locked --release --target x86_64-unknown-none --manifest-path services/net-tls/Cargo.toml
      - name: No generated source changes
        run: git diff --exit-code
