name: M6e scalable volume acceptance

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'tools/**'
      - 'kernel/**'
      - 'boot/**'
      - 'userspace/**'
      - 'services/**'
      - 'drivers/**'
      - 'crates/**'
      - '.cargo/**'
      - 'sdk/**'
      - 'ui/**'
      - 'experiments/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/volume-acceptance.yml'
      - '.github/actions/**'
      - '.github/actions/preserve-evidence/**'
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: volume-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-group-gate:
    # PR B of ADR-CI-MERGE-GROUP-SELECT-20261126: on merge_group only, merge-hold's own plan from
    # the trusted base T says whether this workflow is left out; only then do the jobs below skip.
    name: volume-acceptance merge-group gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: T is the merge base of the queue commit and main.
          fetch-depth: 0
      - name: Decide from merge-hold's plan
        id: gate
        uses: ./.github/actions/merge-group-gate
        with:
          workflow: .github/workflows/volume-acceptance.yml

  m6e:
    name: m6e-native-volume
    needs: merge-group-gate
    if: ${{ !cancelled() && (needs.merge-group-gate.result != 'success' || needs.merge-group-gate.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
      NOS_BUILD_DIR: ${{ github.workspace }}/build/ci-m6e
      NOS_TARGET_DIR: ${{ github.workspace }}/target/ci-m6e
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-m6e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Rust 1.100.0 and targets
        shell: bash
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict
      - name: M6e/S06 native volume gate (34 QEMU runs)
        run: python3 -B -u tools/test_volume.py
      - name: Require mandatory gate report
        if: ${{ always() }}
        shell: bash
        run: |
          report='build/ci-m6e/volume-gate.json'
          if [[ ! -f "$report" || ! -s "$report" || -L "$report" ]]; then
            echo "::error::Required gate report is missing, empty, or not a regular file: $report"
            exit 1
          fi
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          if-no-files-found: error
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: m6e-volume-reports
          required-paths: build/ci-m6e/volume-gate.json
          path: |
            build/ci-m6e/volume-gate.json
            build/ci-m6e/run/volume-*/result.json
            build/ci-m6e/run/volume-*/serial.txt
