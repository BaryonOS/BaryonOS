name: M6e scalable volume acceptance

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'tools/**'
      - 'kernel/**'
      - 'boot/**'
      - 'userspace/**'
      - 'services/**'
      - 'drivers/**'
      - 'crates/**'
      - '.cargo/**'
      - 'sdk/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/volume-acceptance.yml'
      - '.github/actions/preserve-evidence/**'
      - '.github/actions/setup-python/**'
      - '.github/actions/setup-qemu/**'

permissions:
  contents: read

concurrency:
  group: volume-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m6e:
    name: m6e-native-volume
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
      NOS_BUILD_DIR: ${{ github.workspace }}/build/ci-m6e
      NOS_TARGET_DIR: ${{ github.workspace }}/target/ci-m6e
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-m6e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Rust 1.90.0 and targets
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt clippy
          rustup target add --toolchain 1.90.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict
      - name: M6e/S06 native volume gate (9 QEMU runs)
        run: python3 -B -u tools/test_volume.py
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          if-no-files-found: warn
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: m6e-volume-reports
          path: |
            build/ci-m6e/volume-gate.json
            build/ci-m6e/run/volume-*/result.json
            build/ci-m6e/run/volume-*/serial.txt
