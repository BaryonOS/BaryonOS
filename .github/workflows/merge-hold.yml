# Merge gate for PRs whose acceptance runs outside the required checks.
# While the `acceptance-pending` label is set, this check fails unless a trusted
# participant commented `acceptance-released: <head SHA>` for the current head
# commit. A new push changes the SHA and re-arms the hold. Labels and comments
# are read live (tools/merge_hold.py). On merge_group it first waits for
# host-quality and qemu-smoke to complete on the queue commit and, under an
# enforcing plan, for every applicable gate run of that commit, then walks the
# entries ahead from the nearest: each must have left the queue or finished
# host-quality, qemu-smoke and merge-hold on its own commit, and the walk ends
# at a merge-hold that succeeded, so it decides just before the group can merge.
# Every gate poll also reads the queue: a group that was removed or rebuilt, or
# (enforcing) a gate that has already failed, ends the wait with a failure.
# It then judges the gates on the queue commit, checks every pull request in it
# and fails closed if they cannot be identified or the 45-minute wait expires.
# A hold added after that final read is not seen. See ADR-MERGE-HOLD-20261113.
#
# Phase 3 of #494 (ADR-CI-GATE-ENFORCEMENT-20261124): the decision runs the base
# commit's tools/merge_hold.py and tools/ci_impact.py, never the pull request's
# copies. On pull_request it recomputes the CI impact plan and requires every
# applicable automatic gate to have passed on the pull request head; see
# docs/CI-CONTRACT.md "Enforcement". With the catalogue's pull_request wait budget
# of 0 it fails "Pending" while gates run, and merge-hold-recheck.yml re-runs it
# once they have finished (#494 B9). On merge_group (D1 step 2) it recomputes
# the plan for the queue commit and judges every applicable gate there, from
# runs bound to the merge_group event, the queue commit and the queue branch.
# This file may add environment variables, but must keep every one an older
# base merge_hold.py reads.
name: Merge hold

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # Each merge group has its own gh-readonly-queue ref, so groups never cancel each other.
  group: merge-hold-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-hold:
    name: merge-hold
    runs-on: ubuntu-24.04
    # Above the 30-minute host-quality and qemu-smoke budgets plus queueing,
    # below the planned 60-minute merge-queue check timeout.
    timeout-minutes: 50
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The selector needs the merge base of the base tip and the head.
          fetch-depth: 0
      - name: Load merge-hold and the selector from the base commit
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = pull_request ]; then
            # GitHub's merge commit: first parent is the base tip, second the head.
            read -r _ base second extra <<< "$(git rev-list --parents -n 1 HEAD)"
            if [ -n "${extra:-}" ] || [ "${second:-}" != "$HEAD_SHA" ]; then
              echo "::error::The checked-out merge commit does not join the base tip and the pull request head."
              exit 1
            fi
          else
            base="$MERGE_GROUP_BASE_SHA"
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No usable base commit; failing closed."
            exit 1
          fi
          dir="$RUNNER_TEMP/merge-hold-base"
          mkdir -p "$dir"
          git cat-file blob "$base:tools/merge_hold.py" > "$dir/merge_hold.py"
          if git cat-file -e "$base:tools/ci_impact.py" 2> /dev/null; then
            git cat-file blob "$base:tools/ci_impact.py" > "$dir/ci_impact.py"
          fi
          {
            echo "base-sha=$base"
            echo "tested-sha=$tested"
          } >> "$GITHUB_OUTPUT"
      - name: Fail while acceptance is pending or an applicable gate has not passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ steps.base.outputs.base-sha }}
          TESTED_SHA: ${{ steps.base.outputs.tested-sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 -B -I "$RUNNER_TEMP/merge-hold-base/merge_hold.py"
