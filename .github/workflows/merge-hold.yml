# Merge gate for PRs whose acceptance runs outside the required checks.
# While the `acceptance-pending` label is set, this check fails unless a trusted
# participant commented `acceptance-released: <head SHA>` for the current head
# commit. A new push changes the SHA and re-arms the hold. Labels and comments
# are read live (tools/merge_hold.py). On merge_group it first waits for
# host-quality and qemu-smoke to complete on the queue commit, then until the
# entry ahead has left the queue or finished host-quality, qemu-smoke and
# merge-hold on its own commit, so it decides just before the group can merge.
# It then checks every pull request in the queue commit and fails closed if
# they cannot be identified or the 45-minute wait expires. A hold added after
# that final read is not seen. See ADR-MERGE-HOLD-20261113.
name: Merge hold

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  # Each merge group has its own gh-readonly-queue ref, so groups never cancel each other.
  group: merge-hold-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-hold:
    name: merge-hold
    runs-on: ubuntu-24.04
    # Above the 30-minute host-quality and qemu-smoke budgets plus queueing,
    # below the planned 60-minute merge-queue check timeout.
    timeout-minutes: 50
    permissions:
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail while acceptance is pending for this head commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: python3 -B tools/merge_hold.py
