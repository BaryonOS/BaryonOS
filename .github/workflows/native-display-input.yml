name: Native display and input acceptance

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py', '.agents/**', '.claude/**', '.claude-plugin/**', '.codex/**', 'plugins/**', '.c8rc.json', '.coveragerc', '.coderabbit.yaml', 'LICENSE', 'MPL-2.0-FILES.txt']
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']

permissions:
  contents: read

concurrency:
  group: native-display-input-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  merge-group-gate:
    # PR B of ADR-CI-MERGE-GROUP-SELECT-20261126: on merge_group only, merge-hold's own plan from
    # the trusted base T says whether this workflow is left out; only then do the jobs below skip.
    name: native-display-input merge-group gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: T is the merge base of the queue commit and main.
          fetch-depth: 0
      - name: Decide from merge-hold's plan
        id: gate
        uses: ./.github/actions/merge-group-gate
        with:
          workflow: .github/workflows/native-display-input.yml

  native-display-input:
    needs: merge-group-gate
    if: ${{ !cancelled() && (needs.merge-group-gate.result != 'success' || needs.merge-group-gate.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      NOS_BUILD_DIR: ${{ github.workspace }}/build/display-input-ci
      NOS_TARGET_DIR: ${{ github.workspace }}/target/display-input-ci
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/display-input-ci-host
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Pinned Rust, lint tools and real targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Cache Cargo downloads only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Ubuntu emulator package diagnostics
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          test -f "$OS_OVMF_CODE"
          test -f "$OS_OVMF_VARS"
          test -f /usr/share/seabios/vgabios-stdvga.bin
          mkdir -p "$NOS_BUILD_DIR/logs"
          dpkg-query -W qemu-system-x86 ovmf seabios > "$NOS_BUILD_DIR/logs/ci-packages.txt"
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict | tee "$NOS_BUILD_DIR/logs/preflight.json"
      - name: Fetch locked dependencies before offline component and native builds
        run: |
          cargo +1.100.0 fetch --locked
          for manifest in \
            drivers/ps2/Cargo.toml \
            sdk/display-client/Cargo.toml \
            ui/native/Cargo.toml \
            ui/surface-protocol/Cargo.toml \
            sdk/examples/settings-volume/Cargo.toml \
            sdk/examples/search-volume/Cargo.toml \
            sdk/examples/input-service/Cargo.toml \
            sdk/examples/display-input-probe/Cargo.toml
          do
            cargo +1.100.0 fetch --locked --manifest-path "$manifest"
          done
      - name: Standalone host tests, lint and formatting
        run: |
          for manifest in \
            drivers/ps2/Cargo.toml \
            sdk/display-client/Cargo.toml \
            ui/native/Cargo.toml \
            ui/surface-protocol/Cargo.toml \
            sdk/examples/settings-volume/Cargo.toml \
            sdk/examples/search-volume/Cargo.toml \
            sdk/examples/input-service/Cargo.toml
          do
            cargo +1.100.0 test --offline --locked --manifest-path "$manifest" 2>&1 | tee -a "$NOS_BUILD_DIR/logs/standalone-host.txt"
            cargo +1.100.0 clippy --offline --locked --manifest-path "$manifest" --all-targets -- -D warnings 2>&1 | tee -a "$NOS_BUILD_DIR/logs/standalone-host.txt"
            cargo +1.100.0 fmt --manifest-path "$manifest" --all -- --check 2>&1 | tee -a "$NOS_BUILD_DIR/logs/standalone-host.txt"
          done
      - name: Scalar freestanding libraries
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/display-input-ci-scalar
          RUSTFLAGS: -C no-redzone=yes -C target-feature=-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2
        run: |
          for manifest in \
            drivers/ps2/Cargo.toml \
            sdk/display-client/Cargo.toml \
            ui/native/Cargo.toml \
            ui/surface-protocol/Cargo.toml \
            sdk/examples/settings-volume/Cargo.toml \
            sdk/examples/search-volume/Cargo.toml
          do
            cargo +1.100.0 build --offline --locked --release --lib --target x86_64-unknown-none --manifest-path "$manifest" 2>&1 | tee -a "$NOS_BUILD_DIR/logs/standalone-scalar.txt"
          done
      - name: Settings and search independent oracle regressions
        # Host models and runner counterexamples only; search S3 native wiring
        # remains a separate acceptance step.
        run: python3 -B -m unittest tests.test_settings_oracle tests.test_search_oracle tools.tests.test_run_search
      - name: Cross-build and lint the search app (S2, no native execution)
        # S3 has no kernel case yet. Match the documented S2 user ELF flags;
        # never inherit the kernel linker script for this userspace binary.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/display-input-ci-search
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          root = Path.cwd()
          flags = ["-C", "code-model=small", "-C", "relocation-model=static",
                   "-C", "no-redzone=yes", "-C", "linker=rust-lld",
                   "-C", f"link-arg=-T{root / 'sdk/examples/volume-docs/linker.ld'}",
                   "-C", "link-arg=--no-pie", "-C", "link-arg=--build-id=none",
                   "-C", "link-arg=-zmax-page-size=0x1000"]
          env = {**os.environ, "CARGO_ENCODED_RUSTFLAGS": "\x1f".join(flags)}
          for action in ("build", "clippy"):
              command = ["cargo", "+1.100.0", action, "--offline", "--locked", "--release",
                         "--manifest-path", "sdk/examples/search-volume/Cargo.toml",
                         "--features", "native", "--bin", "search-app",
                         "--target", "x86_64-unknown-none"]
              if action == "clippy":
                  command += ["--", "-D", "warnings"]
              subprocess.run(command, env=env, check=True)
          PY
      - name: Cross-build isolated input daemon executables
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/display-input-ci-daemon
        # The raw-source and policy ELFs compile here; their execution is a
        # separate integration gate, not claimed by the display boundary probe.
        run: python3 -B sdk/examples/input-service/build.py 2>&1 | tee "$NOS_BUILD_DIR/logs/input-service-build.txt"
      - name: Native fixture and evidence-gate counterexamples
        run: |
          cargo +1.100.0 test --offline --locked --manifest-path sdk/examples/display-input-probe/Cargo.toml 2>&1 | tee "$NOS_BUILD_DIR/logs/display-fixture-host.txt"
          python3 -B tools/test_display_probe.py 2>&1 | tee "$NOS_BUILD_DIR/logs/display-gate-host.txt"
      - name: Build the paired native display/input image once
        # No native image/report cache: all three embedded CPL3 programs and
        # the current kernel/loader are built by this one existing builder.
        run: python3 -B -u tools/build.py --kernel-feature native-display-probe
      - name: Actual QMP pixels, keyboard, mouse, isolation and slot reuse
        run: |
          python3 -B -u tools/run_display_probe.py \
            --qmp-transport pipe \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin \
            2>&1 | tee "$NOS_BUILD_DIR/logs/display-native.txt"
      - name: H03 DISPI mode set (positive and refused)
        # Runs after the display probe: this build replaces its image manifest.
        run: |
          python3 -B -u tools/build.py --kernel-feature native-dispi-probe
          python3 -B -u tools/run_dispi.py --case positive 2>&1 | tee "$NOS_BUILD_DIR/logs/dispi-positive.txt"
          python3 -B -u tools/run_dispi.py --case negative 2>&1 | tee "$NOS_BUILD_DIR/logs/dispi-negative.txt"
      - name: Native per-domain settings persistence and cold recovery
        # Six disposable cold boots exercise initialization, recovery, revert,
        # corruption fallback and version refusal. This is the U05-N1 slice,
        # not full U05 acceptance or user authentication/encryption evidence.
        run: |
          for case in settings settings-recover; do
            NOS_BUILD_DIR="$NOS_BUILD_DIR/$case" python3 -B -u tools/build.py --kernel-feature "test-volume-$case"
          done
          python3 -B -u tools/run_settings.py \
            --settings-build "$NOS_BUILD_DIR/settings" \
            --recover-build "$NOS_BUILD_DIR/settings-recover" \
            --timeout 120 2>&1 | tee "$NOS_BUILD_DIR/logs/settings-native.txt"
      - name: Preserve clean tracked sources and standalone output paths
        run: |
          git diff --exit-code
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: native-display-input-evidence
          path: build/display-input-ci/
