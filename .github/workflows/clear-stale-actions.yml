# Second-pass cleanup for stale rerun attempts; hosted workflows are excluded.
name: Clear orphaned self-hosted Actions queue (one-shot)

on:
  push:
    branches:
      - maintenance/clear-stale-actions-20261109
    paths:
      - .github/workflows/clear-stale-actions.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: one-shot-stale-actions-cleanup
  cancel-in-progress: false

jobs:
  cancel-orphans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Cancel only stale queued jobs requiring unavailable self-hosted runners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          from urllib import error, request

          repo = os.environ["GITHUB_REPOSITORY"]
          own_id = int(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GITHUB_TOKEN"]
          cutoff = "2026-11-08T22:00:00Z"
          base = f"https://api.github.com/repos/{repo}"

          def api(method, path):
              req = request.Request(
                  "https://api.github.com" + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "baryon-ci-orphan-cleanup",
                  },
              )
              with request.urlopen(req, timeout=30) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else {}

          # Collect the snapshot before cancellation to avoid offset-page skips.
          run_candidates = []
          for page in range(1, 30):
              result = api("GET", f"/repos/{repo}/actions/runs?status=queued&per_page=100&page={page}")
              batch = result.get("workflow_runs", [])
              if not batch:
                  break
              run_candidates.extend(
                  r for r in batch
                  if r["id"] != own_id and r["created_at"] < cutoff
              )
              if len(batch) < 100:
                  break
          print(f"Stale queued candidates: {len(run_candidates)}", flush=True)

          def inspect(run):
              run_id = run["id"]
              try:
                  jobs = api("GET", f"/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")
                  obsolete = any(
                      job.get("status") == "queued"
                      and "self-hosted" in job.get("labels", [])
                      for job in jobs.get("jobs", [])
                  )
                  return run_id, obsolete, None
              except Exception as exc:
                  return run_id, False, str(exc)

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              inspected = list(pool.map(inspect, run_candidates))

          stale_ids = [rid for rid, obsolete, err in inspected if obsolete]
          errors = [(rid, err) for rid, obsolete, err in inspected if err]
          print(f"Verified orphaned self-hosted runs: {len(stale_ids)}", flush=True)
          if errors:
              print(f"Inspection errors: {errors[:10]}", flush=True)

          canceled, failed = [], []
          for rid in stale_ids:
              try:
                  api("POST", f"/repos/{repo}/actions/runs/{rid}/cancel")
                  canceled.append(rid)
              except error.HTTPError as exc:
                  failed.append({"run_id": rid, "http": exc.code, "reason": exc.read().decode(errors="replace")[:180]})
              except Exception as exc:
                  failed.append({"run_id": rid, "error": str(exc)})
          print(json.dumps({
              "snapshot_candidates": len(run_candidates),
              "self_hosted_orphans": len(stale_ids),
              "cancel_requested": len(canceled),
              "failed": failed,
              "canceled_run_ids": canceled,
          }, indent=2), flush=True)
          if errors or failed:
              raise SystemExit("Some orphaned runs could not be processed; see log.")
          PY
