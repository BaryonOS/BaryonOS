name: Storage resilience acceptance

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'tools/**'
      - 'kernel/**'
      - 'boot/**'
      - 'userspace/**'
      - 'services/**'
      - 'drivers/**'
      - 'crates/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/storage-resilience.yml'
      - '.github/actions/preserve-evidence/**'

permissions:
  contents: read

concurrency:
  group: storage-resilience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s08:
    name: s08-native-resilience
    runs-on: [self-hosted, Linux, X64, unraid, build]
    timeout-minutes: 30
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      NOS_BUILD_DIR: ${{ github.workspace }}/build/ci-s08
      NOS_TARGET_DIR: ${{ github.workspace }}/target/ci-s08
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-s08
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90.0 and targets
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt clippy
          rustup target add --toolchain 1.90.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Disposable QEMU and OVMF
        run: |
          dpkg -s qemu-system-x86 ovmf >/dev/null 2>&1 || { echo "::warning::ontbreekt in runner-image: qemu-system-x86 ovmf"; sudo apt-get update; sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf; }
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict
      - name: S08 native resilience gate
        run: python3 -B -u tools/test_storage_resilience.py
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          if-no-files-found: warn
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: s08-storage-resilience-report
          path: build/ci-s08/s08-storage-resilience.json
