name: GitHub Project field classification

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply supported classifications (unchecked means dry-run)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: baryon-project-classification
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Test classification rules
        run: python3 -m unittest discover -s tests -p 'test_project_classification.py'
      - name: Classify and synchronise project items
        env:
          BARYON_PROJECTS_TOKEN: ${{ secrets.BARYON_PROJECTS_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          args=()
          if [ "$APPLY" = "true" ]; then
            args+=(--apply)
          fi
          # A missing secret must not turn every scheduled run red; a manual
          # run still fails so the configuration gap stays visible.
          if [ "$EVENT" = "schedule" ]; then
            args+=(--skip-without-token)
          fi
          python3 tools/project_classification.py "${args[@]}"
