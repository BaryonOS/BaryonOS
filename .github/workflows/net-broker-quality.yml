name: Network broker quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: net-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  net-broker-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.91.1
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup component add --toolchain 1.91.1 rustfmt clippy
          rustup target add --toolchain 1.91.1 x86_64-unknown-none
      - name: Broker and transport host gates
        run: |
          for crate in net-broker net-stack; do
            cargo +1.91.1 test --locked --manifest-path "services/$crate/Cargo.toml"
            cargo +1.91.1 clippy --locked --manifest-path "services/$crate/Cargo.toml" --all-targets -- -D warnings
            cargo +1.91.1 fmt --manifest-path "services/$crate/Cargo.toml" --all -- --check
          done
      - name: Allocator-free baremetal library
        run: cargo +1.91.1 build --locked --manifest-path services/net-broker/Cargo.toml --release --target x86_64-unknown-none
      - name: No generated source changes
        run: git diff --exit-code
