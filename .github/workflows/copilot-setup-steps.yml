name: Copilot Setup Steps

# Omgeving voor de Copilot coding agent op de eigen WSL-runner
# (ADR-CI-COPILOT-WSL-20261106). De job moet `copilot-setup-steps` heten.
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: [self-hosted, Linux, X64, copilot-wsl]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Controleer sudo, KVM, QEMU en Rust
        run: |
          sudo -n true
          test -r /dev/kvm && test -w /dev/kvm
          qemu-system-x86_64 --version | head -1
          swtpm --version | head -1
          ls /usr/share/OVMF/OVMF_CODE_4M.fd
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version && cargo --version
