name: Copilot hosted development environment

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-python/**
      - .github/actions/setup-qemu/**
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: copilot-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Copilot requires this exact job ID and reads it from the default branch.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python and host dependencies
        uses: ./.github/actions/setup-python
        with:
          host-dependencies: 'true'
      - name: Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Rust toolchains and freestanding targets
        shell: bash
        run: |
          for toolchain in 1.90.0 1.91.1; do
            rustup toolchain install "$toolchain" --profile minimal \
              --component rustfmt,clippy \
              --target x86_64-unknown-none,x86_64-unknown-uefi
          done
      - name: Pinned QEMU, OVMF and software TPM
        uses: ./.github/actions/setup-qemu
        with:
          swtpm: 'true'
      - name: Verify the disposable TCG development environment
        shell: bash
        run: |
          python3 -B tools/preflight.py --strict
