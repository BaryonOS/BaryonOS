name: Validate OS Dev integration

on:
  push:
    branches:
      - codex/add-os-dev-skill
    paths:
      - '.github/workflows/validate-osdev-integration.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OS Dev skill
        shell: bash
        run: |
          set -euo pipefail
          python .agents/skills/os-dev/scripts/validate_skill.py
          python -B -S -m unittest discover -s .agents/skills/os-dev/tests
          python .agents/skills/os-dev/scripts/zoeken.py --id W001461 --max-lines 5 >/tmp/wiki-smoke.txt
          python .agents/skills/os-dev/scripts/zoeken.py --id B053 --max-lines 5 >/tmp/book-smoke.txt
      - name: Validate progress meter
        run: python3 tools/progress.py --check
