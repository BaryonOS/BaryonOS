name: Native window session and Windows QEMU bundle

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py', '.agents/**', '.claude/**', '.claude-plugin/**', '.codex/**', 'plugins/**', '.c8rc.json', '.coveragerc', '.coderabbit.yaml', 'LICENSE', 'MPL-2.0-FILES.txt']
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']

permissions:
  contents: read

concurrency:
  group: native-window-session-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    # Scale-independent host gate: no step reads NOS_WINDOW_SCALE or a window
    # feature, so it runs once. Run 45424451804 measured about 1.5 min of setup
    # and 7-9 min of host checks.
    timeout-minutes: 30
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      NOS_BUILD_DIR: ${{ github.workspace }}/build/window-session-ci/host
      NOS_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-host-native
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-host
      CI_EVIDENCE_DIR: ${{ github.workspace }}/build/window-session-ci/evidence
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Prepare source-bound evidence
        run: |
          mkdir -p "$CI_EVIDENCE_DIR" "$NOS_BUILD_DIR/logs"
          python3 -B - <<'PY' > "$CI_EVIDENCE_DIR/source.json"
          import json, subprocess, sys
          sys.path.insert(0, "tools")
          from common import source_hash
          print(json.dumps({
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_sha256": source_hash(),
              "source_fingerprint_version": 3,
          }, indent=2))
          PY
      - name: Pinned Rust, lint tools and real targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
          rustc +1.100.0 -vV > "$CI_EVIDENCE_DIR/rustc.txt"
          cargo +1.100.0 --version > "$CI_EVIDENCE_DIR/cargo.txt"
      - name: Cache Cargo downloads only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Ubuntu emulator package diagnostics
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          for path in \
            "$OS_OVMF_CODE" "$OS_OVMF_VARS" \
            /usr/share/seabios/bios-256k.bin \
            /usr/share/seabios/vgabios-stdvga.bin \
            /usr/share/doc/ovmf/copyright \
            /usr/share/doc/seabios/copyright
          do
            test -f "$path"
          done
          dpkg-query -W qemu-system-x86 ovmf seabios > "$CI_EVIDENCE_DIR/packages.txt"
          qemu-system-x86_64 --version > "$CI_EVIDENCE_DIR/qemu.txt"
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict | tee "$CI_EVIDENCE_DIR/preflight.json"
      - name: Fetch every locked app dependency before offline builders
        uses: ./.github/actions/fetch-locked-deps
      - name: Runner and Windows packager counterexamples
        run: |
          python3 -B tools/test_window_session.py 2>&1 | tee "$CI_EVIDENCE_DIR/runner-host.txt"
          python3 -B -m unittest tools.tests.test_package_windows_qemu 2>&1 | tee "$CI_EVIDENCE_DIR/package-host.txt"
      - name: Real scene and protocol host checks
        run: |
          cargo +1.100.0 test --offline --locked --manifest-path sdk/examples/window-session/Cargo.toml 2>&1 | tee "$CI_EVIDENCE_DIR/scene-host.txt"
          cargo +1.100.0 clippy --offline --locked --manifest-path sdk/examples/window-session/Cargo.toml --all-targets -- -D warnings 2>&1 | tee "$CI_EVIDENCE_DIR/scene-clippy.txt"
          cargo +1.100.0 fmt --manifest-path sdk/examples/window-session/Cargo.toml -- --check
          cargo +1.100.0 test --offline --locked --manifest-path ui/surface-protocol/Cargo.toml --features client 2>&1 | tee "$CI_EVIDENCE_DIR/surface-host.txt"
          cargo +1.100.0 test --offline --locked --manifest-path ui/graphics/Cargo.toml 2>&1 | tee "$CI_EVIDENCE_DIR/graphics-host.txt"
          for crate in materiaal calculator; do
            cargo +1.100.0 test --offline --locked --manifest-path "sdk/examples/$crate/Cargo.toml" 2>&1 | tee "$CI_EVIDENCE_DIR/$crate-host.txt"
            cargo +1.100.0 clippy --offline --locked --manifest-path "sdk/examples/$crate/Cargo.toml" --all-targets -- -D warnings 2>&1 | tee "$CI_EVIDENCE_DIR/$crate-clippy.txt"
            cargo +1.100.0 fmt --manifest-path "sdk/examples/$crate/Cargo.toml" -- --check
          done
      - name: Preserve tracked source integrity
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Record the job outcome even on failure
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$CI_EVIDENCE_DIR"
          printf '%s\n' "$CI_JOB_STATUS" > "$CI_EVIDENCE_DIR/job-status.txt"
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: native-window-session-host-checks-evidence
          required-paths: |
            build/window-session-ci/evidence/source.json
            build/window-session-ci/evidence/preflight.json
            build/window-session-ci/evidence/runner-host.txt
            build/window-session-ci/evidence/package-host.txt
          path: |
            build/window-session-ci/evidence/

  native-window-session:
    name: native-window-session (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    # Independent legs: no needs on host-checks, no artifact hand-off. Each leg
    # builds its own probe in its own build/target directories and keeps its
    # own proof. Timeout = harness deadline(s) + 15 min for setup, locked fetch,
    # probe build and evidence (about 2 min on run 45424451804).
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - leg: native-scale1
            mode: native
            scale: 1
            probe_feature: native-window-session-probe
            proof: native-window-scale-1-proof
            timeout: 45 # 1800 s harness + 15 min
          - leg: native-scale2
            mode: native
            scale: 2
            probe_feature: native-window-session-hidpi-probe
            proof: native-window-scale-2-proof
            timeout: 60 # 2700 s harness (ADR-WINDOW-SCALE2-DEADLINE-20261112) + 15 min
          - leg: library
            mode: library
            scale: 1
            probe_feature: native-window-session-probe
            proof: native-window-library-write-proof
            timeout: 75 # 2 x 1800 s harness (write, then cold) + 15 min
          - leg: switcher-scale1
            mode: switcher
            scale: 1
            probe_feature: native-window-session-probe
            proof: native-window-switcher-scale1-proof
            timeout: 45 # 1800 s harness + 15 min
          - leg: switcher-scale2
            mode: switcher
            scale: 2
            probe_feature: native-window-session-hidpi-probe
            proof: native-window-switcher-scale2-proof
            timeout: 45 # 1800 s harness + 15 min
    env:
      NOS_WINDOW_LEG: ${{ matrix.leg }}
      NOS_WINDOW_SCALE: ${{ matrix.scale }}
      NOS_WINDOW_PROBE_FEATURE: ${{ matrix.probe_feature }}
      NOS_QEMU_MACHINE: pc-q35-8.2
      NOS_BUILD_DIR: ${{ github.workspace }}/build/window-session-ci/${{ matrix.leg }}
      NOS_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-${{ matrix.leg }}-native
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-${{ matrix.leg }}-host
      CI_EVIDENCE_DIR: ${{ github.workspace }}/build/window-session-ci/evidence
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Prepare source-bound evidence
        run: |
          mkdir -p "$CI_EVIDENCE_DIR" "$NOS_BUILD_DIR/logs"
          python3 -B - <<'PY' > "$CI_EVIDENCE_DIR/source.json"
          import json, subprocess, sys
          sys.path.insert(0, "tools")
          from common import source_hash
          print(json.dumps({
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_sha256": source_hash(),
              "source_fingerprint_version": 3,
          }, indent=2))
          PY
      - name: Pinned Rust, lint tools and real targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
          rustc +1.100.0 -vV > "$CI_EVIDENCE_DIR/rustc.txt"
          cargo +1.100.0 --version > "$CI_EVIDENCE_DIR/cargo.txt"
      - name: Cache Cargo downloads only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Ubuntu emulator package diagnostics
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          for path in \
            "$OS_OVMF_CODE" "$OS_OVMF_VARS" \
            /usr/share/seabios/bios-256k.bin \
            /usr/share/seabios/vgabios-stdvga.bin \
            /usr/share/doc/ovmf/copyright \
            /usr/share/doc/seabios/copyright
          do
            test -f "$path"
          done
          dpkg-query -W qemu-system-x86 ovmf seabios > "$CI_EVIDENCE_DIR/packages.txt"
          qemu-system-x86_64 --version > "$CI_EVIDENCE_DIR/qemu.txt"
      - name: Fetch every locked app dependency before offline builders
        uses: ./.github/actions/fetch-locked-deps
      - name: Build the eight-process native window probe
        # No image/target cache: the existing builder inspects and embeds all
        # eight fresh CPL3 ELFs plus the current own kernel and UEFI loader.
        env:
          CARGO_NET_OFFLINE: 'true'
        run: python3 -B -u tools/build.py --kernel-feature "$NOS_WINDOW_PROBE_FEATURE" 2>&1 | tee "$CI_EVIDENCE_DIR/probe-build.txt"
      - name: Actual input, unmasked pixels, isolation, crash recovery and disk
        id: native-gate
        if: ${{ matrix.mode == 'native' }}
        run: |
          # Scale 1 keeps the preregistered 1800 s; scale 2 needs a wider
          # harness deadline on slower hosted runners (ADR-WINDOW-SCALE2-DEADLINE-20261112).
          gate_timeout=1800
          if [ "$NOS_WINDOW_SCALE" = 2 ]; then gate_timeout=2700; fi
          python3 -B -u tools/run_window_session.py \
            --clipboard \
            --workspace \
            --scale "$NOS_WINDOW_SCALE" \
            --timeout "$gate_timeout" \
            --bios-rom /usr/share/seabios/bios-256k.bin \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin \
            2>&1 | tee "$CI_EVIDENCE_DIR/native-gate.txt"
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["NOS_BUILD_DIR"]) / "window-session-report.json").read_text())
          assert report["passed"] is True and report["native_gate"] is True
          assert report["clipboard_requested"] is True and report["clipboard_gate"] is True
          assert report["workspace_requested"] is True and report["workspace_gate"] is True
          assert report["document_tools_gate"] is True
          assert report["document_menu_gate"] is True
          assert report["pointer_leave_gate"] is True
          assert report["app_high_contrast_gate"] is True
          assert report["window_states_gate"] is True
          assert report["keyboard_window_move_gate"] is True
          assert report["notification_panel_gate"] is True
          assert report["trusted_lock_gate"] is True
          assert report["locked_f7_gate"] is True
          assert report["smoke_only"] is False and report["raw_qemu_exit"] == 33
          assert report["kernel_feature"] == os.environ["NOS_WINDOW_PROBE_FEATURE"]
          assert report["scale"] == int(os.environ["NOS_WINDOW_SCALE"])
          assert report["native_scale200_gate"] is (report["scale"] == 2)
          volume = Path(report["run_directory"]) / "volume.img"
          with volume.open("rb") as image:
              digest = hashlib.file_digest(image, "sha256").hexdigest()
          (Path(os.environ["CI_EVIDENCE_DIR"]) / "native-volume.sha256").write_text(
              digest + "  " + volume.relative_to(Path.cwd()).as_posix() + "\n")
          PY
      - name: Native material names, collections, search and revision recovery
        # Library walkthrough and cold parent are 100%-profile gates.
        if: ${{ matrix.mode == 'library' }}
        run: |
          python3 -B -u tools/run_window_session.py \
            --library --timeout 1800 \
            --bios-rom /usr/share/seabios/bios-256k.bin \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin \
            2>&1 | tee "$CI_EVIDENCE_DIR/library-write.txt"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["NOS_BUILD_DIR"]) / "window-session-report.json"
          report = json.loads(path.read_text())
          assert report["passed"] is True and report["library_gate"] is True
          assert report["library_cold"] is False and report["native_gate"] is False
          assert report["raw_qemu_exit"] == 33 and len(report["phases"]) == 10
          output = Path(os.environ["CI_EVIDENCE_DIR"])
          (output / "library-write-report.json").write_bytes(path.read_bytes())
          (output / "library-parent.txt").write_text(report["run_directory"] + "\n")
          PY
      - name: Cold reopen the source-bound disposable library image
        # Reopens the parent written by the previous step of this same leg.
        if: ${{ matrix.mode == 'library' }}
        run: |
          read -r library_parent < "$CI_EVIDENCE_DIR/library-parent.txt"
          python3 -B -u tools/run_window_session.py \
            --library --library-cold-parent "$library_parent" --timeout 1800 \
            --bios-rom /usr/share/seabios/bios-256k.bin \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin \
            2>&1 | tee "$CI_EVIDENCE_DIR/library-cold.txt"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["NOS_BUILD_DIR"]) / "window-session-report.json"
          report = json.loads(path.read_text())
          assert report["passed"] is True and report["library_gate"] is True
          assert report["library_cold"] is True and report["native_gate"] is False
          assert report["raw_qemu_exit"] == 33 and len(report["phases"]) == 4
          assert report["volume_sha256"] == report["library_parent"]["volume_sha256"]
          (Path(os.environ["CI_EVIDENCE_DIR"]) / "library-cold-report.json").write_bytes(path.read_bytes())
          PY
      - name: Native window-switcher partial gate at 100% or 200%
        if: ${{ matrix.mode == 'switcher' }}
        run: |
          set -euo pipefail
          python3 -B -u tools/run_window_session.py \
            --switcher --scale "$NOS_WINDOW_SCALE" --timeout 1800 \
            --bios-rom /usr/share/seabios/bios-256k.bin \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin \
            2>&1 | tee "$CI_EVIDENCE_DIR/switcher-native-scale$NOS_WINDOW_SCALE.txt"
          python3 - "$NOS_WINDOW_SCALE" <<'PY'
          import json, os, sys
          from pathlib import Path
          scale = int(sys.argv[1])
          path = Path(os.environ["NOS_BUILD_DIR"]) / "window-session-report.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["passed"] is True and report["switcher_gate"] is True
          assert report["native_gate"] is False and report["scale"] == scale
          assert report["raw_qemu_exit"] == 33 and len(report["phases"]) == 18
          assert report["source_commit"] == os.environ["GITHUB_SHA"]
          output = Path(os.environ["CI_EVIDENCE_DIR"])
          (output / f"switcher-native-scale{scale}.json").write_bytes(path.read_bytes())
          PY
      - name: Preserve tracked source integrity
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Locate immutable native proof for each attempted gate
        id: window-proof-paths
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          python3 -B - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          leg = os.environ["NOS_WINDOW_LEG"]
          scale = int(os.environ["NOS_WINDOW_SCALE"])
          # Each leg owns one build directory; the library leg holds two runs.
          plans = {"native-scale1": {"primary": (1, "native")},
                   "native-scale2": {"primary": (2, "native")},
                   "library": {"primary": (1, "library-write"), "library-cold": (1, "library-cold")},
                   "switcher-scale1": {"primary": (1, "switcher")},
                   "switcher-scale2": {"primary": (2, "switcher")}}[leg]
          if any(expected_scale != scale for expected_scale, _ in plans.values()):
              raise SystemExit("Leg scale differs from its proof plan: " + leg)
          def mode(report):
              if report.get("library_requested") is True:
                  return "library-cold" if report.get("library_cold") is True else "library-write"
              if report.get("switcher_requested") is True:
                  return "switcher"
              if report.get("workspace_requested") is True and report.get("clipboard_requested") is True:
                  return "native"
              return "other"
          outputs, missing = {}, []
          for role, (expected_scale, expected_mode) in plans.items():
              matches = []
              for path in sorted((root / "build/window-session-ci" / leg / "run").glob("window-*/result.json")):
                  if (path.is_symlink() or path.parent.is_symlink()
                          or not re.fullmatch(r"window-[0-9a-f]{32}", path.parent.name)
                          or not path.resolve().is_relative_to(root)
                          or path.stat().st_size > 4 * 1024 * 1024):
                      raise SystemExit("Unsafe or oversized native proof path: " + str(path))
                  report = json.loads(path.read_text())
                  if mode(report) != expected_mode or report.get("scale") != expected_scale:
                      continue
                  if (report.get("source_commit") != os.environ["GITHUB_SHA"]
                          or Path(report["run_directory"]).resolve() != path.parent.resolve()):
                      raise SystemExit("Native proof source or run directory differs: " + str(path))
                  matches.append(path.parent.relative_to(root).as_posix())
              if len(matches) > 1:
                  raise SystemExit("Ambiguous native proof for " + leg + "/" + expected_mode)
              if not matches:
                  missing.append(leg + "/" + expected_mode)
              # Missing paths remain required. Failed jobs retain whatever exists;
              # successful jobs cannot silently turn missing evidence into a pass.
              run = matches[0] if matches else "build/window-session-ci/missing/" + expected_mode
              outputs[role + "-report"] = run + "/result.json"
              outputs[role + "-serial"] = run + "/serial.txt"
          common = ["evidence/source.json", leg + "/manifest.json"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as target:
              for key, value in outputs.items():
                  target.write(key + "=" + value + "\n")
              target.write("common-required<<WINDOW_REQUIRED\n")
              target.write("\n".join("build/window-session-ci/" + path for path in common))
              target.write("\nWINDOW_REQUIRED\n")
          if missing and os.environ["CI_JOB_STATUS"] == "success":
              raise SystemExit("Missing native proof: " + ", ".join(missing))
          PY
      # Independent original report/serial pairs avoid duplicate summaries and
      # unrelated gates competing for the unchanged 7 MiB payload/1 MiB receipt.
      # The observed scale-2 report is 1,553,981 B; serial is bounded at 4 MiB by
      # the runner. Required paths fail closed if either allowance is exceeded.
      - name: Preserve complete base native proof
        id: window-native-proof
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          name: ${{ matrix.proof }}
          job-status: ${{ job.status }}
          full-evidence: 'false'
          max-file-bytes: '4194304'
          path: |
            ${{ steps.window-proof-paths.outputs.primary-report }}
            ${{ steps.window-proof-paths.outputs.primary-serial }}
          required-paths: |
            ${{ steps.window-proof-paths.outputs.primary-report }}
            ${{ steps.window-proof-paths.outputs.primary-serial }}
      - name: Preserve complete library cold proof
        id: window-library-cold-proof
        if: ${{ always() && matrix.mode == 'library' }}
        uses: ./.github/actions/preserve-evidence
        with:
          name: native-window-library-cold-proof
          job-status: ${{ job.status }}
          full-evidence: 'false'
          max-file-bytes: '4194304'
          path: |
            ${{ steps.window-proof-paths.outputs.library-cold-report }}
            ${{ steps.window-proof-paths.outputs.library-cold-serial }}
          required-paths: |
            ${{ steps.window-proof-paths.outputs.library-cold-report }}
            ${{ steps.window-proof-paths.outputs.library-cold-serial }}
      - name: Record the job outcome even on failure
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$CI_EVIDENCE_DIR"
          printf '%s\n' "$CI_JOB_STATUS" > "$CI_EVIDENCE_DIR/job-status.txt"
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: native-window-session-${{ matrix.leg }}-evidence
          required-paths: ${{ steps.window-proof-paths.outputs.common-required }}
          path: |
            build/window-session-ci/evidence/
            build/window-session-ci/${{ matrix.leg }}/manifest.json
            build/window-session-ci/${{ matrix.leg }}/users/materiaal/build-report.json
            build/window-session-ci/${{ matrix.leg }}/logs/
            build/window-session-ci/${{ matrix.leg }}/esp/
            build/window-session-ci/${{ matrix.leg }}/window-session-report.json
            build/window-session-ci/${{ matrix.leg }}/run/window-*/result.json
            build/window-session-ci/${{ matrix.leg }}/run/window-*/serial.txt
            build/window-session-ci/${{ matrix.leg }}/run/window-*/stderr.txt
            build/window-session-ci/${{ matrix.leg }}/run/window-*/volume.img
            build/window-session-ci/${{ matrix.leg }}/run/window-*/*.ppm
            build/window-session-ci/${{ matrix.leg }}/window-fixture-*/fixture.json
            build/window-session-ci/${{ matrix.leg }}/window-fixture-*/generator.log
            build/window-session-ci/${{ matrix.leg }}/window-fixture-*/*.ppm

  readonly-compile:
    runs-on: ubuntu-24.04
    # Compile only: 15 s build plus about 2 min setup on run 45424451804.
    timeout-minutes: 20
    env:
      NOS_BUILD_DIR: ${{ github.workspace }}/build/window-session-ci/readonly-compile
      NOS_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-readonly-compile
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-readonly-compile-host
      CI_EVIDENCE_DIR: ${{ github.workspace }}/build/window-session-ci/evidence
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Prepare source-bound evidence
        run: |
          mkdir -p "$CI_EVIDENCE_DIR" "$NOS_BUILD_DIR/logs"
          python3 -B - <<'PY' > "$CI_EVIDENCE_DIR/source.json"
          import json, subprocess, sys
          sys.path.insert(0, "tools")
          from common import source_hash
          print(json.dumps({
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_sha256": source_hash(),
              "source_fingerprint_version": 3,
          }, indent=2))
          PY
      - name: Pinned Rust, lint tools and real targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
          rustc +1.100.0 -vV > "$CI_EVIDENCE_DIR/rustc.txt"
          cargo +1.100.0 --version > "$CI_EVIDENCE_DIR/cargo.txt"
      - name: Cache Cargo downloads only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch every locked app dependency before offline builders
        uses: ./.github/actions/fetch-locked-deps
      - name: Cross-build the read-only grant profile (U03-T3 part 1)
        env:
          CARGO_NET_OFFLINE: 'true'
        # Compile the cfg-gated kernel checks. The service-refusal walkthrough
        # belongs to part 2 and is not exercised or accepted by this step.
        run: python3 -B -u tools/build.py --kernel-feature test-window-session-readonly 2>&1 | tee "$CI_EVIDENCE_DIR/readonly-profile-compile.txt"
      - name: Preserve tracked source integrity
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Record the job outcome even on failure
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$CI_EVIDENCE_DIR"
          printf '%s\n' "$CI_JOB_STATUS" > "$CI_EVIDENCE_DIR/job-status.txt"
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: native-window-session-readonly-compile-evidence
          required-paths: |
            build/window-session-ci/evidence/source.json
            build/window-session-ci/readonly-compile/manifest.json
            build/window-session-ci/evidence/readonly-profile-compile.txt
          path: |
            build/window-session-ci/evidence/
            build/window-session-ci/readonly-compile/manifest.json
            build/window-session-ci/readonly-compile/logs/

  normal-and-package:
    # Normal profiles are built and packaged only after every host, native and
    # read-only gate passed. Packaging reads only this job's normal build
    # directory; it never sees the fault-injection probe image.
    needs: [host-checks, native-window-session, readonly-compile]
    runs-on: ubuntu-24.04
    # Normal build (4 s) and packaging (1 s) plus about 2 min setup on run 45424451804.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scale: [1, 2]
    env:
      NOS_WINDOW_SCALE: ${{ matrix.scale }}
      NOS_WINDOW_NORMAL_FEATURE: ${{ matrix.scale == 2 && 'native-window-session-hidpi' || 'native-window-session' }}
      NOS_BUILD_DIR: ${{ github.workspace }}/build/window-session-ci/normal
      NOS_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-normal
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/window-session-ci-normal-host
      CI_EVIDENCE_DIR: ${{ github.workspace }}/build/window-session-ci/evidence
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Prepare source-bound evidence
        run: |
          mkdir -p "$CI_EVIDENCE_DIR" "$NOS_BUILD_DIR/logs"
          python3 -B - <<'PY' > "$CI_EVIDENCE_DIR/source.json"
          import json, subprocess, sys
          sys.path.insert(0, "tools")
          from common import source_hash
          print(json.dumps({
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_sha256": source_hash(),
              "source_fingerprint_version": 3,
          }, indent=2))
          PY
      - name: Pinned Rust, lint tools and real targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
          rustc +1.100.0 -vV > "$CI_EVIDENCE_DIR/rustc.txt"
          cargo +1.100.0 --version > "$CI_EVIDENCE_DIR/cargo.txt"
      - name: Cache Cargo downloads only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Ubuntu emulator package diagnostics
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          for path in \
            "$OS_OVMF_CODE" "$OS_OVMF_VARS" \
            /usr/share/seabios/bios-256k.bin \
            /usr/share/seabios/vgabios-stdvga.bin \
            /usr/share/doc/ovmf/copyright \
            /usr/share/doc/seabios/copyright
          do
            test -f "$path"
          done
          dpkg-query -W qemu-system-x86 ovmf seabios > "$CI_EVIDENCE_DIR/packages.txt"
          qemu-system-x86_64 --version > "$CI_EVIDENCE_DIR/qemu.txt"
      - name: Fetch every locked app dependency before offline builders
        uses: ./.github/actions/fetch-locked-deps
      - name: Build the normal window session only after native acceptance
        env:
          CARGO_NET_OFFLINE: 'true'
        # Separate jobs retain the probe manifest and every tested input.
        # Packaging never substitutes the fault-injection probe image.
        run: python3 -B -u tools/build.py --kernel-feature "$NOS_WINDOW_NORMAL_FEATURE" 2>&1 | tee "$CI_EVIDENCE_DIR/normal-build.txt"
      - name: Package the reviewable Windows QEMU bundle
        if: ${{ success() && matrix.scale == 1 }}
        # Ubuntu packaging and Linux native execution do not claim Windows
        # runtime acceptance. The package manifest keeps that boundary explicit.
        run: |
          python3 -B -u tools/package_windows_qemu.py \
            --output "$CI_EVIDENCE_DIR/NieuwOS-Venstersessie-Windows-QEMU.zip" \
            --ovmf-code "$OS_OVMF_CODE" \
            --ovmf-vars "$OS_OVMF_VARS" \
            --seabios-bios /usr/share/seabios/bios-256k.bin \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin \
            --ovmf-license /usr/share/doc/ovmf/copyright \
            --seabios-license /usr/share/doc/seabios/copyright \
            --ovmf-version "$(dpkg-query -W -f='${Version}' ovmf)" \
            --seabios-version "$(dpkg-query -W -f='${Version}' seabios)" \
            2>&1 | tee "$CI_EVIDENCE_DIR/package.json"
          sha256sum "$CI_EVIDENCE_DIR/NieuwOS-Venstersessie-Windows-QEMU.zip" > "$CI_EVIDENCE_DIR/package.sha256"
      - name: Preserve tracked source integrity
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Record the job outcome even on failure
        if: ${{ always() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$CI_EVIDENCE_DIR"
          printf '%s\n' "$CI_JOB_STATUS" > "$CI_EVIDENCE_DIR/job-status.txt"
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          package-path: ${{ matrix.scale == 1 && 'build/window-session-ci/evidence/NieuwOS-Venstersessie-Windows-QEMU.zip' || '' }}
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: native-window-session-scale-${{ matrix.scale }}-evidence-and-windows-bundle
          required-paths: |
            build/window-session-ci/evidence/source.json
            build/window-session-ci/normal/manifest.json
            ${{ matrix.scale == 1 && 'build/window-session-ci/evidence/package.json' || '' }}
            ${{ matrix.scale == 1 && 'build/window-session-ci/evidence/package.sha256' || '' }}
          path: |
            build/window-session-ci/evidence/
            build/window-session-ci/normal/manifest.json
            build/window-session-ci/normal/users/materiaal/build-report.json
            build/window-session-ci/normal/logs/
