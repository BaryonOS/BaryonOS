name: K paired window scale-2 diagnostic

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: k-paired-window-scale2-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  paired-window-scale2:
    name: paired ${{ matrix.leg }} ${{ matrix.order }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout }}
    env:
      LEG: ${{ matrix.leg }}
      ORDER: ${{ matrix.order }}
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: native-scale2
            order: AB
            job_timeout: 105
          - leg: native-scale2
            order: BA
            job_timeout: 105
          - leg: switcher-scale2
            order: AB
            job_timeout: 75
          - leg: switcher-scale2
            order: BA
            job_timeout: 75
    steps:
      - name: Checkout reviewed diagnostic harness ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout fixed non-C3 control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c5867e4584b4012c5db0f704a6d4e6ae1d9e4257
          path: control
          persist-credentials: false
      - name: Checkout fixed C3 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 560758fb6e34b0c215587fd5503dea0a49ee710d
          path: candidate
          persist-credentials: false
      - name: Pinned Python
        uses: ./candidate/.github/actions/setup-python
      - name: Pinned QEMU and OVMF
        uses: ./candidate/.github/actions/setup-qemu
      - name: Pinned Rust and native targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Fetch locked dependency closures for both sources
        run: |
          set -euo pipefail
          for source in control candidate; do
            (
              cd "$source"
              cargo +1.100.0 fetch --locked
              for manifest in sdk/Cargo.toml sdk/examples/materiaal/Cargo.toml \
                sdk/examples/input-service/Cargo.toml sdk/examples/window-session/Cargo.toml \
                sdk/examples/calculator/Cargo.toml ui/graphics/Cargo.toml \
                ui/native/Cargo.toml ui/surface-protocol/Cargo.toml
              do
                cargo +1.100.0 fetch --locked --manifest-path "$manifest"
              done
            )
          done
      - name: Run paired scale-2 workload
        run: >-
          bash ./.github/ci-diagnostics/k602-run-pair.sh "$LEG" "$ORDER" control candidate
          "$RUNNER_TEMP/k-h1-receipts"
      - name: Retain every attempted receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k-h1-${{ matrix.leg }}-${{ matrix.order }}
          path: ${{ runner.temp }}/k-h1-receipts/
          if-no-files-found: error
          retention-days: 7
