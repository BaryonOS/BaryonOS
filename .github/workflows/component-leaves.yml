name: Component leaf quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-leaves-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  select:
    # Phase 4 of #494 (docs/CI-CONTRACT.md "Selection"): which jobs and variants of
    # this workflow the trusted base plan needs. merge-hold verifies the result.
    name: component-leaves select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      narrowed: ${{ steps.jobs.outputs.narrowed }}
      run-component-quality: ${{ steps.jobs.outputs.run-component-quality }}
      matrix-component-quality: ${{ steps.jobs.outputs.matrix-component-quality }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the merge base never depends on a shallow clone.
          fetch-depth: 0
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Trusted base of the queue commit
        # merge_group plans from T, as merge-hold does, never from merge_group.base_sha
        # (ADR-CI-MERGE-GROUP-SELECT-20261126); a failure fails this job, and merge-hold blocks.
        if: ${{ github.event_name == 'merge_group' }}
        id: trusted
        uses: ./.github/actions/trusted-base
        with:
          event-name: ${{ github.event_name }}
          merge-group-base-sha: ${{ github.event.merge_group.base_sha }}
      - name: Plan with the trusted base selector
        id: plan
        uses: ./.github/actions/select-ci
        with:
          event-name: ${{ github.event_name }}
          tested-sha: ${{ github.sha }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          # Empty on pull_request (the action uses the merge ref's first parent) and on dispatch.
          base-sha: ${{ steps.trusted.outputs.base-sha || (github.event_name == 'push' && github.event.before) || '' }}
          base-ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
      - name: Jobs and variants to run
        id: jobs
        shell: bash
        env:
          PLAN_PATH: ${{ steps.plan.outputs.plan-path }}
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          # Untrusted rendering (the checkout's copy); merge-hold alone decides.
          python3 -B tools/ci_impact.py jobs --plan="$PLAN_PATH" \
            --mode="$PLAN_MODE" --base-ref="$BASE_REF" \
            --workflow=.github/workflows/component-leaves.yml --tested-sha="$TESTED_SHA" | tee -a "$GITHUB_OUTPUT"

  component-quality:
    name: component-quality (${{ matrix.component }})
    needs: select
    if: ${{ needs.select.outputs.run-component-quality == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Keep runner capacity available for required checks and native gates.
      max-parallel: 4
      # Variants come from .github/ci-impact.toml through the select job (phase 4).
      matrix: ${{ fromJSON(needs.select.outputs.matrix-component-quality) }}
    env:
      RUST_TOOLCHAIN: ${{ matrix.toolchain }}
      COMPONENT_MANIFEST: ${{ matrix.manifest }}
      # The platform apps gate their CLI binaries and process tests behind host-cli.
      COMPONENT_FEATURES: ${{ matrix.features || '' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/component-leaves/${{ matrix.component }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup component add --toolchain "$RUST_TOOLCHAIN" rustfmt clippy
          rustup target add --toolchain "$RUST_TOOLCHAIN" x86_64-unknown-none
      # net-config and its existing net-stack dependency require Rust 1.91.
      # net-broker-quality.yml runs net-stack's own host tests and Clippy.
      # Default tests include virtio-snd's cfg(test) transport model.
      # ACPI's ignored firmware-fixture test requires a separate QEMU gate.
      - name: Host unit, integration and documentation tests
        run: cargo "+$RUST_TOOLCHAIN" test --locked --manifest-path "$COMPONENT_MANIFEST" $COMPONENT_FEATURES
      - name: Clippy for all targets
        run: cargo "+$RUST_TOOLCHAIN" clippy --locked --manifest-path "$COMPONENT_MANIFEST" $COMPONENT_FEATURES --all-targets -- -D warnings
      - name: Formatting
        run: cargo "+$RUST_TOOLCHAIN" fmt --manifest-path "$COMPONENT_MANIFEST" -- --check
      - name: Freestanding scalar library build (not native execution)
        env:
          RUSTFLAGS: -C no-redzone=yes -C target-feature=-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2
        run: cargo "+$RUST_TOOLCHAIN" build --locked --release --lib --target x86_64-unknown-none --manifest-path "$COMPONENT_MANIFEST"
