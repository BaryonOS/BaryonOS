# Throwaway canary for ADR-CI-QEMU-BUNDLE-20261111; this branch is deleted after the run.
name: QEMU APT bundle canary

on:
  push:
    branches:
      - ci/qemu-apt-canary

permissions:
  contents: read

jobs:
  noble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qemu
        with:
          swtpm: 'true'
      - run: swtpm --version
  resolute:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-qemu
