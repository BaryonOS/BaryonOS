name: B01 entropy and key management acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: b01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b01-native-supervisor:
    name: b01-native-supervisor
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.90.0 and targets
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Disposable QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict
      - name: B01 native keyring gate (5 QEMU runs)
        run: python3 -B -u tools/test_keyring.py
      - name: Upload B01 reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b01-supervisor-reports
          path: |
            build/keyring-gate.json
            build/run/keyring-*/result.json
            build/run/keyring-*/serial.txt
          if-no-files-found: error
