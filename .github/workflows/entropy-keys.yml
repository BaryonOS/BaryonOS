name: B01 entropy and key management acceptance

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: b01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b01-native-supervisor:
    name: b01-native-supervisor
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Rust 1.90.0 and targets
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup target add --toolchain 1.90.0 x86_64-unknown-none x86_64-unknown-uefi
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict
      - name: B01 native keyring gate (5 QEMU runs)
        run: python3 -B -u tools/test_keyring.py
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: b01-supervisor-reports
          path: |
            build/keyring-gate.json
            build/run/keyring-*/result.json
            build/run/keyring-*/serial.txt
