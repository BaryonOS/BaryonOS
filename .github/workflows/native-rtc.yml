name: Native CMOS RTC acceptance

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-rtc-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native-rtc:
    runs-on: [self-hosted, Linux, X64, unraid, build]
    timeout-minutes: 15
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      NOS_BUILD_DIR: ${{ github.workspace }}/build/rtc-native
      NOS_TARGET_DIR: ${{ github.workspace }}/target/rtc-native
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/rtc-host
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Rust and emulator
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy --target x86_64-unknown-none,x86_64-unknown-uefi
          dpkg -s qemu-system-x86 ovmf >/dev/null 2>&1 || { echo "::warning::ontbreekt in runner-image: qemu-system-x86 ovmf"; sudo apt-get update; sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf; }
          mkdir -p "$NOS_BUILD_DIR/logs"
      - name: Host oracles, RTC codec and formatting
        run: |
          python3 -B tools/preflight.py --strict > "$NOS_BUILD_DIR/logs/preflight.json"
          python3 -B -m unittest discover -s tools/tests -p test_rtc.py -v
          cargo +1.90.0 test --locked --manifest-path drivers/rtc/Cargo.toml
          cargo +1.90.0 clippy --locked --manifest-path drivers/rtc/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 fmt --all -- --check
      - name: Own loader and RTC kernel
        run: |
          python3 -B tools/build.py --kernel-feature native-rtc
      - name: Five real controlled-calendar boots
        run: python3 -B tools/run_rtc.py --case all
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: native-rtc-evidence
          path: build/rtc-native/
