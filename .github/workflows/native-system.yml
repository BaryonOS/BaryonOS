name: FR-I01 joint native system acceptance

on:
  workflow_dispatch:
    inputs:
      full_evidence:
        description: 'Also retain raw images, frames and builds for 1 day'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py', '.agents/**', '.claude/**', '.claude-plugin/**', '.codex/**', 'plugins/**', '.c8rc.json', '.coveragerc', '.coderabbit.yaml', 'LICENSE', 'MPL-2.0-FILES.txt']
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']

permissions:
  contents: read

concurrency:
  group: native-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-group-gate:
    # PR B of ADR-CI-MERGE-GROUP-SELECT-20261126: on merge_group only, merge-hold's own plan from
    # the trusted base T says whether this workflow is left out; only then do the jobs below skip.
    name: native-system merge-group gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: T is the merge base of the queue commit and main.
          fetch-depth: 0
      - name: Decide from merge-hold's plan
        id: gate
        uses: ./.github/actions/merge-group-gate
        with:
          workflow: .github/workflows/native-system.yml

  native-system:
    needs: merge-group-gate
    if: ${{ !cancelled() && (needs.merge-group-gate.result != 'success' || needs.merge-group-gate.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
      NOS_BUILD_DIR: ${{ github.workspace }}/build/system-ci
      NOS_TARGET_DIR: ${{ github.workspace }}/target/system-ci
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/system-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Pinned Rust and real targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup target add --toolchain 1.100.0 x86_64-unknown-none x86_64-unknown-uefi
          rustup toolchain install 1.100.0 --profile minimal
          rustup target add --toolchain 1.100.0 x86_64-unknown-none
      - name: Pinned QEMU and OVMF
        uses: ./.github/actions/setup-qemu
        with:
          swtpm: 'true'
      - name: Strict preflight
        run: python3 -B tools/preflight.py --strict
      - name: Fetch locked build dependencies before offline native builders
        run: |
          cargo +1.100.0 fetch --locked
          cargo +1.100.0 fetch --locked --manifest-path sdk/Cargo.toml
          cargo +1.100.0 fetch --locked --manifest-path sdk/examples/tcp-probe/Cargo.toml
          cargo +1.100.0 fetch --locked --manifest-path services/net-stack/Cargo.toml
          cargo +1.100.0 fetch --locked --manifest-path sdk/examples/memory/Cargo.toml
          cargo +1.100.0 fetch --locked --manifest-path sdk/examples/ipc-wait-probe/Cargo.toml
          cargo +1.100.0 fetch --locked --manifest-path experiments/ai/native-job/Cargo.toml
      - name: Native IPC queue waits, revocation and resumable PIT idle
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/ipc-wait-ci
          NOS_TARGET_DIR: ${{ github.workspace }}/target/ipc-wait-ci-native
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ipc-wait-ci-host
        run: |
          python3 -B -m unittest tools.tests.test_ipc_wait
          cargo +1.100.0 test --offline --locked -p capability-core
          cargo +1.100.0 test --offline --locked --manifest-path sdk/examples/input-service/Cargo.toml
          python3 -B -u tools/run_ipc_wait.py
      - name: Real joint-service guest and exact-image cold recovery
        run: python3 -B -u tools/test_system.py
      - name: Actual TPM CRB MMIO property query release and absent-device quarantine
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/tpm-ci
          NOS_TARGET_DIR: ${{ github.workspace }}/target/tpm-ci
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/tpm-ci-host
        run: |
          python3 -B -m unittest tools.tests.test_tpm
          cargo +1.100.0 test --offline --locked --manifest-path drivers/tpm-crb/Cargo.toml
          python3 -B -u tools/run_tpm.py --case normal
          python3 -B -u tools/run_tpm.py --case absent
      - name: Independently revalidate raw images and capture compact evidence
        run: python3 -B tools/capture_system.py --destination docs/verification/full-release-system-ci
      - name: Native ring-3 unauthenticated UTC clock and malformed-call rejection
        run: |
          python3 -B -m unittest tools.tests.test_system_clock
          python3 -B -u tools/run_system_clock.py
      - name: Real native ARP UDP DNS and same-image cold recovery
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/system-net-ci
          NOS_TARGET_DIR: ${{ github.workspace }}/target/system-net-ci
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/system-net-ci
        run: python3 -B -u tools/test_net_system.py
      - name: Revalidate native counters peer transcript firmware policy and images
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/system-net-ci
        run: python3 -B tools/capture_system.py --network --destination docs/verification/full-release-network-ci
      - name: Native virtio-net link loss, reconnect, no-STATUS and budget exhaustion (H04-T3)
        env:
          NOS_TARGET_DIR: ${{ github.workspace }}/target/system-net-ci
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/system-net-ci
        run: |
          set -euo pipefail
          python3 -B -m unittest tools.tests.test_net_link
          export NOS_BUILD_DIR="$GITHUB_WORKSPACE/build/net-link-ci"
          python3 -B tools/build.py --kernel-feature test-system-net-link
          python3 -B -u tools/run_net_link.py --case normal
          python3 -B -u tools/run_net_link.py --case nostatus
          export NOS_BUILD_DIR="$GITHUB_WORKSPACE/build/net-link-storm-ci"
          python3 -B tools/build.py --kernel-feature test-system-net-link-storm
          python3 -B -u tools/run_net_link.py --case storm
      - name: Actual x87 SSE process state and monotonic clock isolation
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/fpu-ci
          NOS_TARGET_DIR: ${{ github.workspace }}/target/fpu-ci
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fpu-ci
        run: |
          python3 -B tools/test_fpu.py
          python3 -B tools/build.py --kernel-feature native-fpu
          python3 -B tools/run_fpu.py
          NOS_BUILD_DIR="${NOS_BUILD_DIR}/wait" python3 -B tools/build.py --kernel-feature test-fpu-wait
          NOS_BUILD_DIR="${NOS_BUILD_DIR}/wait" python3 -B tools/run_fpu.py
      - name: Actual native TCP and exact-image cold recovery
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/tcp-ci
          NOS_TARGET_DIR: ${{ github.workspace }}/target/tcp-ci
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/tcp-ci
        run: python3 -B -u tools/test_tcp_system.py
      - name: Revalidate TCP handshake retransmission FIN timeout and raw images
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/tcp-ci
        run: python3 -B tools/capture_system.py --tcp --destination docs/verification/full-release-tcp-ci
      - name: Actual native TCP loss backpressure and exact-image cold recovery
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/tcp-loss-ci
          NOS_TARGET_DIR: ${{ github.workspace }}/target/tcp-loss-ci
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/tcp-loss-ci
        run: python3 -B -u tools/test_tcp_system.py --scenario loss-backpressure
      - name: Own heap zeroing NX guard peer isolation physical OOM and cleanup
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/memory-ci
          NOS_TARGET_DIR: ${{ github.workspace }}/target/memory-ci
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/memory-ci-host
        run: python3 -B -u tools/test_memory_system.py
      - name: Actual native SSE2 AI job under preemption, slot reuse and host-oracle equality
        env:
          NOS_BUILD_DIR: ${{ github.workspace }}/build/ci-ai-job
          NOS_TARGET_DIR: ${{ github.workspace }}/target/ci-ai-job
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-ai-job
        run: |
          python3 -B tools/build.py --kernel-feature native-ai-job
          python3 -B tools/run_ai_job.py
      - name: Preserve compact evidence and report archive availability
        if: ${{ always() }}
        uses: ./.github/actions/preserve-evidence
        with:
          job-status: ${{ job.status }}
          full-evidence: ${{ github.event_name == 'workflow_dispatch' && inputs.full_evidence }}
          name: native-system-evidence
          required-paths: |
            build/tcp-ci/tcp-system-gate.json
            build/tcp-loss-ci/tcp-system-gate.json
            build/net-link-ci/manifest.json
            build/net-link-storm-ci/manifest.json
          path: |
            build/net-link-ci/manifest.json
            build/net-link-ci/logs/
            build/net-link-ci/run/system-*/result.json
            build/net-link-ci/run/system-*/network-peer.json
            build/net-link-ci/run/system-*/link-control.json
            build/net-link-ci/run/system-*/serial.txt
            build/net-link-ci/run/system-*/stderr.txt
            build/net-link-storm-ci/manifest.json
            build/net-link-storm-ci/logs/
            build/net-link-storm-ci/run/system-*/result.json
            build/net-link-storm-ci/run/system-*/network-peer.json
            build/net-link-storm-ci/run/system-*/link-control.json
            build/net-link-storm-ci/run/system-*/serial.txt
            build/net-link-storm-ci/run/system-*/stderr.txt
            build/ipc-wait-ci/
            build/tpm-ci/tpm-*-report.json
            build/tpm-ci/manifest.json
            build/tpm-ci/logs/
            build/tpm-ci/run/tpm-*/
            build/tpm-ci/tpm/*/backend.log
            build/memory-ci/memory-gate.json
            build/memory-ci/logs/
            build/memory-ci/*/memory-report.json
            build/memory-ci/*/manifest.json
            build/memory-ci/*/logs/
            build/memory-ci/*/users/memory/build-report.json
            build/memory-ci/*/esp/
            build/memory-ci/*/run/native-memory-*/
            build/system-ci/system-gate.json
            build/system-ci/system-clock-report.json
            build/system-ci/manifest.json
            build/system-ci/logs/
            build/system-ci/run/system-*/result.json
            build/system-ci/run/system-*/serial.txt
            build/system-ci/run/system-*/stderr.txt
            build/system-ci/run/system-*/volume.after.img
            build/system-ci/esp/
            docs/verification/full-release-system-ci/
            build/system-net-ci/net-system-gate.json
            build/system-net-ci/manifest.json
            build/system-net-ci/logs/
            build/system-net-ci/run/system-*/result.json
            build/system-net-ci/run/system-*/network-peer.json
            build/system-net-ci/run/system-*/serial.txt
            build/system-net-ci/run/system-*/stderr.txt
            build/system-net-ci/run/system-*/volume.after.img
            build/system-net-ci/esp/
            docs/verification/full-release-network-ci/
            build/fpu-ci/fpu-report.json
            build/fpu-ci/manifest.json
            build/fpu-ci/logs/
            build/fpu-ci/run/native-fpu-*/
            build/fpu-ci/esp/
            build/fpu-ci/wait/
            build/ci-ai-job/manifest.json
            build/ci-ai-job/native-ai-job-result.json
            build/ci-ai-job/users/ai-job/build-report.json
            build/ci-ai-job/users/ai-job/disassembly.stdout.txt
            build/ci-ai-job/users/ai-job/ai-job-native.elf
            build/ci-ai-job/run/native-ai-job-*/
            build/ci-ai-job/esp/
            build/ci-ai-job/logs/
            build/tcp-ci/tcp-system-gate.json
            build/tcp-ci/manifest.json
            build/tcp-ci/logs/
            build/tcp-ci/run/system-*/result.json
            build/tcp-ci/run/system-*/network-peer.json
            build/tcp-ci/run/system-*/serial.txt
            build/tcp-ci/run/system-*/stderr.txt
            build/tcp-ci/run/system-*/volume.after.img
            build/tcp-ci/esp/
            docs/verification/full-release-tcp-ci/
            build/tcp-loss-ci/tcp-system-gate.json
            build/tcp-loss-ci/manifest.json
            build/tcp-loss-ci/logs/
            build/tcp-loss-ci/run/system-*/result.json
            build/tcp-loss-ci/run/system-*/network-peer.json
            build/tcp-loss-ci/run/system-*/serial.txt
            build/tcp-loss-ci/run/system-*/stderr.txt
            build/tcp-loss-ci/run/system-*/volume.after.img
            build/tcp-loss-ci/esp/
