name: App package and artifact quality

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

permissions:
  contents: read

concurrency:
  group: app-management-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-package-quality:
    name: app-package-core and app-management host/target quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Rust 1.90.0 and freestanding target
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup component add --toolchain 1.90.0 rustfmt clippy
          rustup target add --toolchain 1.90.0 x86_64-unknown-none
      - name: Existing package-core coverage
        run: |
          cargo +1.90.0 test --locked -p app-package-core
          cargo +1.90.0 clippy --locked -p app-package-core --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path crates/app-package-core/Cargo.toml -- --check
          CARGO_ENCODED_RUSTFLAGS=$'--cfg\x1fcurve25519_dalek_backend="serial"' \
            cargo +1.90.0 build --locked --release -p app-package-core --target x86_64-unknown-none
      - name: Standalone app-management contract
        run: |
          cargo +1.90.0 test --locked --manifest-path sdk/app-management/Cargo.toml
          cargo +1.90.0 clippy --locked --manifest-path sdk/app-management/Cargo.toml --all-targets -- -D warnings
          cargo +1.90.0 fmt --manifest-path sdk/app-management/Cargo.toml --all -- --check
          CARGO_ENCODED_RUSTFLAGS=$'--cfg\x1fcurve25519_dalek_backend="serial"' \
            cargo +1.90.0 build --locked --release --manifest-path sdk/app-management/Cargo.toml --target x86_64-unknown-none
