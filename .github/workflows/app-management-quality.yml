name: App package and artifact quality

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/ISSUE_TEMPLATE/**', '.github/DISCUSSION_TEMPLATE/**', '.github/workflows/project-classification.yml', 'tools/project_classification.py', 'tests/test_project_classification.py']

permissions:
  contents: read

concurrency:
  group: app-management-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    # Phase 4 of #494 (docs/CI-CONTRACT.md "Selection"): which jobs and variants of
    # this workflow the trusted base plan needs. merge-hold verifies the result.
    name: app-management-quality select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      narrowed: ${{ steps.jobs.outputs.narrowed }}
      run-app-package-quality: ${{ steps.jobs.outputs.run-app-package-quality }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the merge base never depends on a shallow clone.
          fetch-depth: 0
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Trusted base of the queue commit
        # merge_group plans from T, as merge-hold does, never from merge_group.base_sha
        # (ADR-CI-MERGE-GROUP-SELECT-20261126); a failure fails this job, and merge-hold blocks.
        if: ${{ github.event_name == 'merge_group' }}
        id: trusted
        uses: ./.github/actions/trusted-base
        with:
          event-name: ${{ github.event_name }}
          merge-group-base-sha: ${{ github.event.merge_group.base_sha }}
      - name: Plan with the trusted base selector
        id: plan
        uses: ./.github/actions/select-ci
        with:
          event-name: ${{ github.event_name }}
          tested-sha: ${{ github.sha }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          # Empty on pull_request (the action uses the merge ref's first parent) and on dispatch.
          base-sha: ${{ steps.trusted.outputs.base-sha || (github.event_name == 'push' && github.event.before) || '' }}
          base-ref: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
      - name: Jobs and variants to run
        id: jobs
        shell: bash
        env:
          PLAN_PATH: ${{ steps.plan.outputs.plan-path }}
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || github.ref_name }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          # Untrusted rendering (the checkout's copy); merge-hold alone decides.
          python3 -B tools/ci_impact.py jobs --plan="$PLAN_PATH" \
            --mode="$PLAN_MODE" --base-ref="$BASE_REF" \
            --workflow=.github/workflows/app-management-quality.yml --tested-sha="$TESTED_SHA" | tee -a "$GITHUB_OUTPUT"

  app-package-quality:
    name: app-package-core and app-management host/target quality
    needs: select
    if: ${{ needs.select.outputs.run-app-package-quality == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Rust 1.100.0 and freestanding target
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none
      - name: Existing package-core coverage
        run: |
          cargo +1.100.0 test --locked -p app-package-core
          cargo +1.100.0 clippy --locked -p app-package-core --all-targets -- -D warnings
          cargo +1.100.0 fmt --manifest-path crates/app-package-core/Cargo.toml -- --check
          CARGO_ENCODED_RUSTFLAGS=$'--cfg\x1fcurve25519_dalek_backend="serial"\x1f--cfg\x1fsha2_backend="soft"' \
            cargo +1.100.0 build --locked --release -p app-package-core --target x86_64-unknown-none
      - name: Standalone app-management contract
        run: |
          cargo +1.100.0 test --locked --manifest-path sdk/app-management/Cargo.toml
          cargo +1.100.0 clippy --locked --manifest-path sdk/app-management/Cargo.toml --all-targets -- -D warnings
          cargo +1.100.0 fmt --manifest-path sdk/app-management/Cargo.toml --all -- --check
          CARGO_ENCODED_RUSTFLAGS=$'--cfg\x1fcurve25519_dalek_backend="serial"\x1f--cfg\x1fsha2_backend="soft"' \
            cargo +1.100.0 build --locked --release --manifest-path sdk/app-management/Cargo.toml --target x86_64-unknown-none
