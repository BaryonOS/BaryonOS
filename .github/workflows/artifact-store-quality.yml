name: Artifact store contract quality

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/actions/**
      - crates/artifact-store-core/**
      - .github/workflows/artifact-store-quality.yml
  # Gates also report on the merge-queue commit (main plus the queued pull
  # requests), with no path filter, so a queue commit runs the full scope.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/actions/**
      - crates/artifact-store-core/**
      - .github/workflows/artifact-store-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-store-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  merge-group-gate:
    # PR B of ADR-CI-MERGE-GROUP-SELECT-20261126: on merge_group only, merge-hold's own plan from
    # the trusted base T says whether this workflow is left out; only then do the jobs below skip.
    name: artifact-store-quality merge-group gate
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: T is the merge base of the queue commit and main.
          fetch-depth: 0
      - name: Decide from merge-hold's plan
        id: gate
        uses: ./.github/actions/merge-group-gate
        with:
          workflow: .github/workflows/artifact-store-quality.yml

  artifact-store-core:
    needs: merge-group-gate
    if: ${{ !cancelled() && (needs.merge-group-gate.result != 'success' || needs.merge-group-gate.outputs.run != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/artifact-store-quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Python
        uses: ./.github/actions/setup-python
      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup component add --toolchain 1.100.0 rustfmt clippy
          rustup target add --toolchain 1.100.0 x86_64-unknown-none
      - name: Contract host tests
        run: cargo +1.100.0 test --locked -p artifact-store-core
      - name: Contract Clippy
        run: cargo +1.100.0 clippy --locked -p artifact-store-core --all-targets -- -D warnings
      - name: Contract formatting
        run: cargo +1.100.0 fmt --manifest-path crates/artifact-store-core/Cargo.toml -- --check
      - name: Freestanding library build
        # Cargo merges this array with .cargo/config.toml; RUSTFLAGS replaces it.
        run: >-
          cargo +1.100.0 build --locked --release --lib --target x86_64-unknown-none -p artifact-store-core
          --config 'target.x86_64-unknown-none.rustflags=["-C", "target-feature=-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2"]'
