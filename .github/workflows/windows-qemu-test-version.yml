name: Windows QEMU native Materiaal test bundle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-qemu-test-version-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  package-and-verify:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      NOS_QEMU_MACHINE: pc-q35-8.2
      NOS_BUILD_DIR: ${{ github.workspace }}/build/windows-qemu
      NOS_TARGET_DIR: ${{ github.workspace }}/target/windows-qemu
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-qemu
      OS_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
      OS_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and VM firmware
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target x86_64-unknown-none,x86_64-unknown-uefi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf seabios
          mkdir -p "$NOS_BUILD_DIR"
      - name: Strict environment inventory
        run: python3 -B tools/preflight.py --strict > "$NOS_BUILD_DIR/preflight.json"
      - name: Fetch locked native app dependencies
        run: |
          cargo +1.90.0 fetch --locked
          cargo +1.90.0 fetch --locked --manifest-path sdk/Cargo.toml
          cargo +1.90.0 fetch --locked --manifest-path sdk/examples/desktop-init/Cargo.toml
          cargo +1.90.0 fetch --locked --manifest-path sdk/examples/materiaal/Cargo.toml
          cargo +1.90.0 fetch --locked --manifest-path sdk/examples/compositor/Cargo.toml
          cargo +1.90.0 fetch --locked --manifest-path sdk/examples/input-service/Cargo.toml
      - name: Packager and preview verifier host tests
        run: python3 -B -m unittest tools.tests.test_materiaal_preview tools.tests.test_package_windows_qemu
      - name: Build and boot the actual native Materiaal profile
        run: |
          python3 -B -u tools/build.py --kernel-feature native-system-materiaal
          python3 -B -u tools/run_materiaal_preview.py \
            --bios-rom /usr/share/seabios/bios-256k.bin \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin
      - name: Package the Windows QEMU test version
        run: |
          python3 -B -u tools/package_windows_qemu.py \
            --ovmf-code "$OS_OVMF_CODE" \
            --ovmf-vars "$OS_OVMF_VARS" \
            --seabios-bios /usr/share/seabios/bios-256k.bin \
            --vga-rom /usr/share/seabios/vgabios-stdvga.bin \
            --ovmf-license /usr/share/doc/ovmf/copyright \
            --seabios-license /usr/share/doc/seabios/copyright \
            --ovmf-version "$(dpkg-query -W -f='${Version}' ovmf)" \
            --seabios-version "$(dpkg-query -W -f='${Version}' seabios)"
      - name: Preserve the test bundle and native VM evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nieuw-os-windows-qemu-test-version
          path: |
            build/windows-qemu/NieuwOS-Testversie-Windows-QEMU.zip
            build/windows-qemu/preview-result.json
            build/windows-qemu/preview-run/materiaal-*/result.json
            build/windows-qemu/preview-run/materiaal-*/serial.txt
            build/windows-qemu/preview-run/materiaal-*/stderr.txt
            build/windows-qemu/preview-run/materiaal-*/preview.ppm
          if-no-files-found: error
          retention-days: 14
