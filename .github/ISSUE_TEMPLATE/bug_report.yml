name: Bug melden
description: Een reproduceerbaar defect in het OS, een app of een prototype
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Bekijk eerst de [bestaande issues](https://github.com/simonvanieperen/nieuw-os/issues).
        Gebruik het CI-formulier voor build-, workflow- en testbewijsproblemen.
        Deel geen secrets, sleutels of echte gebruikersgegevens. Mogelijke kwetsbaarheden
        volgen [SECURITY.md](https://github.com/simonvanieperen/nieuw-os/blob/main/SECURITY.md);
        plaats hier geen exploiteerbare details.
  - type: dropdown
    id: subsystem
    attributes:
      label: Onderdeel
      options:
        - Boot, kernel, processen of IPC
        - Opslag, encryptie of herstel
        - Drivers, invoer of energiebeheer
        - Desktop, Materiaal of toegankelijkheid
        - Netwerk, NAS of synchronisatie
        - SDK, apps of pakketbeheer
        - Lokale AI of quantum-runtime
        - Hostprototype
        - Anders of nog onbekend
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Waar treedt het op?
      options:
        - Hosttest of hostprototype
        - Eigen OS in QEMU
        - Eigen OS in een andere VM
        - Eigen OS op een fysiek apparaat
        - Nog niet vastgesteld
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Geteste bron of image
      description: Commit-SHA, PR of downloadversie; schrijf onbekend als je dit niet kunt vinden.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Wat gaat er mis?
      description: Beschrijf het waargenomen gedrag, de gevolgen en wat je verwachtte.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduceerstappen
      description: De kleinste route met concrete handelingen of commando's, inputs en featureprofiel. Vermeld hoe vaak het gebeurt.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Omgeving
      description: Host-OS en architectuur. Bij een VM ook QEMU/firmware, accelerator, vCPU's en RAM; bij builds de toolversies. Onbekende of niet-relevante onderdelen mogen zo worden benoemd.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bewijs en laatst werkende versie
      description: Geschoonde foutmelding, exitstatus, relevante logregels, screenshot of bereikbare bewijslink. Noem de laatste goede commit als het een regressie is; een lokaal logpad alleen is voor anderen niet leesbaar.
  - type: checkboxes
    id: data_check
    attributes:
      label: Controle
      options:
        - label: Ik heb de melding en bijlagen gecontroleerd op secrets, sleutels en echte gebruikersgegevens.
          required: true
