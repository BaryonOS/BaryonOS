name: Bug report
description: Report a reproducible defect in the OS, an application, or a prototype
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/simonvanieperen/BaryonOS/issues) first.
        Use the CI form for build, workflow, and test-evidence problems.
        Do not include secrets, keys, or real user data. Potential vulnerabilities
        follow [SECURITY.md](https://github.com/simonvanieperen/BaryonOS/blob/main/SECURITY.md);
        do not post exploitable details here.
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - Boot, kernel, processes, or IPC
        - Storage, encryption, or recovery
        - Drivers, input, or power management
        - Desktop, Materiaal, or accessibility
        - Networking, NAS, or synchronisation
        - SDK, applications, or packages
        - Local AI or quantum runtime
        - Host prototype
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Where does this occur?
      options:
        - Host test or host prototype
        - Baryon OS in QEMU
        - Baryon OS in another VM
        - Baryon OS on physical hardware
        - Not yet established
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Tested revision or image
      description: Commit SHA, PR, or downloaded version; state unknown if unavailable.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Observed problem
      description: Describe the actual behaviour, its impact, and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps with commands, inputs, and feature profile. Include frequency.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS and architecture; for VMs include QEMU/firmware, accelerator, vCPUs, and RAM; for builds include tool versions. Mark unavailable or irrelevant fields accordingly.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and last known working version
      description: Sanitised error, exit code, log excerpts, screenshot, or accessible evidence URL. Give the previous working commit for regressions; a local log path alone is not accessible to others.
  - type: checkboxes
    id: data_check
    attributes:
      label: Submission check
      options:
        - label: I checked this report and its attachments for secrets, keys, and real user data.
          required: true
