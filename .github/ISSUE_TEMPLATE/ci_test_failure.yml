name: CI, build, or test evidence
description: Investigate a failing workflow, local build, test gate, or missing evidence
title: "ci: "
body:
  - type: markdown
    attributes:
      value: |
        Distinguish test failures, infrastructure problems, and missing artifacts.
        An upload failure does not necessarily mean the test failed; missing evidence
        is not passing acceptance. Use sanitised logs and synthetic data.
        For vulnerabilities, follow [SECURITY.md](https://github.com/simonvanieperen/BaryonOS/blob/main/SECURITY.md).
  - type: input
    id: source
    attributes:
      label: Source commit and PR
      description: The actual tested SHA and any associated PR, not just a branch name.
    validations:
      required: true
  - type: textarea
    id: run
    attributes:
      label: Workflow, job, and run
      description: Link the run/job and failing step. For local work, give the exact command and feature profile.
    validations:
      required: true
  - type: dropdown
    id: failure_stage
    attributes:
      label: Failure stage
      options:
        - Queue or runner startup
        - Toolchain, dependencies, or build
        - Test or assertion
        - Timeout or hang
        - Artifact upload, storage, or evidence retrieval
        - Unknown
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual result
      description: Exact error and exit code. Which tests started, completed, or did not run? Distinguish host, native VM, and physical tests.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and reproduction
      description: Runner/host, tool versions, and for QEMU its firmware, accelerator, vCPUs, and RAM. State whether the issue was reproduced; write not run if applicable. Retain the same test scope.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Available or missing evidence
      description: Accessible sanitised logs/reports, artifact name, and hashes where available. Identify missing items and prior successful runs on the same revision; do not discard failing results to make the report appear green.
