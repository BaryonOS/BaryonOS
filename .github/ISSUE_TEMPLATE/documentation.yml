name: Documentation correction
description: Report unclear documentation, outdated status, or a claim lacking evidence
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        Current sources and evidence limitations take precedence. An old test
        result does not automatically apply to new code.
        Use [Questions and support](https://github.com/simonvanieperen/BaryonOS/discussions/categories/vragen-en-hulp)
        for general explanations. Do not share sensitive data or vulnerability details.
  - type: input
    id: location
    attributes:
      label: File, section, or URL
      description: Give the exact location, preferably with a revision-specific URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or unclear?
      description: Quote only the relevant excerpt and explain its impact on understanding, execution, or review.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: What explanation is missing or what text needs revision? Suggested replacement wording is welcome but optional.
  - type: textarea
    id: sources
    attributes:
      label: Supporting evidence
      description: Relevant code, revision-specific test results, or primary source with title, organisation, date/version, and URL. Clearly label anything that cannot yet be verified.
