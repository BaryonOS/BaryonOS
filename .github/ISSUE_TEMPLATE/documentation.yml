name: Correct documentation
description: Report an unclear explanation, outdated status or insufficiently supported claim
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        The current source and evidence limits are authoritative. An old test result does not automatically apply to new code.
        Use [Questions and help](https://github.com/simonvanieperen/BaryonOS/discussions/categories/questions-and-help)
        when primarily seeking an explanation. Do not share sensitive data or vulnerability details.
  - type: input
    id: location
    attributes:
      label: File, page or link
      description: Identify the exact section and preferably a URL containing a commit or version.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect or unclear?
      description: Quote only the relevant passage and describe its effect on reading, execution or assessment.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Which explanation is missing or which text needs changing? Precise replacement wording is welcome but not required.
  - type: textarea
    id: sources
    attributes:
      label: Supporting evidence
      description: Relevant code, version-bound test results or a primary source with title, organisation, date/version and URL. Identify what cannot yet be verified.
