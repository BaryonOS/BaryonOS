# CI impact catalogue (schema 1). Contract: docs/CI-CONTRACT.md.
#
# Phase 2b: the advisory ci-impact-shadow job in ci.yml records a plan from
# the base copy of this file; nothing consumes the plan, so it does not change
# which CI runs.
# `python3 -B tools/ci_impact.py validate .github/ci-impact.toml` checks its
# structure; `python3 -B tools/ci_impact.py coverage` reports drift against the
# workflows and the tracked paths.
#
# Execution id: <workflow stem>#<job id>[/<variant id>]. Classes: core, rwa
# (required when affected), advisory, manual, operational, publication. Full
# mode selects only automatic core and rwa executions.
# Structural fields (events, trigger, name, condition, needs, timeout_minutes,
# max_parallel, matrix, check_name, evidence) are verbatim copies of the YAML.

schema_version = 1
revision = 20

[policy]
mode = "select"
# Highest precedence: any change here forces a full plan.
always_full = [
  ".github/**",
  ".github/ci-impact.toml",
  "tools/ci_impact.py",
  "Cargo.lock",
  "**/Cargo.lock",
  "Cargo.toml",
  "sdk/Cargo.toml",
  "rust-toolchain.toml",
  ".cargo/**",
  "**/.cargo/**",
  "rust-toolchain*",
  "**/rust-toolchain*",
  "rustfmt.toml",
  "**/rustfmt.toml",
  ".rustfmt.toml",
  "**/.rustfmt.toml",
  "clippy.toml",
  "**/clippy.toml",
  ".clippy.toml",
  "**/.clippy.toml",
  ".gitattributes",
  # git status cleanliness checks in host-quality and native workflows read it (#494 C2).
  ".gitignore",
  "tools/build.py",
  "tools/build_users.py",
  "tools/common.py",
  "tools/preflight.py",
  "tools/ci_evidence.py",
  "tools/merge_hold.py",
]
# Lowest precedence: a path matching any execution input is never inert, for
# example the compiled services/keyring/vendor/*/README.md files. Equal to the
# metadata paths-ignore of the workflows ("@metadata").
inert = [
  "docs/**",
  "**.md",
  ".github/ISSUE_TEMPLATE/**",
  ".github/DISCUSSION_TEMPLATE/**",
  ".github/workflows/project-classification.yml",
  "tools/project_classification.py",
  "tests/test_project_classification.py",
]
# Read only by the always-running core gates (host-quality, CodeQL). The pull_request
# trigger of a native workflow with a @metadata push backstop may ignore inert plus these
# paths ("@nonnative"); validate rejects a pattern here that names an always_full path.
core_only = [
  ".agents/**",
  ".claude/**",
  ".claude-plugin/**",
  ".codex/**",
  "plugins/**",
  ".c8rc.json",
  ".coveragerc",
  ".coderabbit.yaml",
  "LICENSE",
  "MPL-2.0-FILES.txt",
]

[policy.events]
pull_request = "select"
merge_group = "full"
push = "full"
schedule = "full"
workflow_dispatch = "manual"

# merge-hold wait budgets (minutes), read from the trusted base. On pull_request
# merge-hold decides at once (0) and fails with "Pending" while gates run, so it
# holds no runner while it waits; merge-hold-recheck.yml re-runs it once the gate
# runs of the head have finished (#494 B9, docs/CI-CONTRACT.md "Waiting"). On
# merge_group it still waits, now also for every applicable gate run of the queue
# commit, and ends early when the group leaves the queue or a gate has failed
# (D1 step 2, docs/CI-CONTRACT.md "merge_group"). Both stay below the 90-minute
# job timeout.
[policy.budgets]
pull_request_wait_minutes = 0
merge_group_wait_minutes = 80

[input_sets]
# Integrated QEMU suites: relations to individual sources are not provable, so
# they are selected broadly (issue #494, design risk R6).
native = [
  "kernel/**",
  "boot/**",
  "crates/**",
  "drivers/**",
  "services/**",
  "sdk/**",
  "ui/**",
  "userspace/**",
  "experiments/**",
  "tools/**",
  "tests/**",
]

# Sources compiled into a crate from outside its own directory. Cargo path
# dependencies and manifest target paths are derived by the selector; only
# #[path], include_str!/include_bytes! and runtime CARGO_MANIFEST_DIR joins with a
# '..' segment are registered here (coverage reports unregistered ones).
# when = "always": the escape is compiled whenever the crate is in a closure.
# when = "root": only when the crate is the gate's own root. Allowed only for
# origins under tests/, benches/, examples/, src/bin/, src/main.rs or a declared
# bin/test/example/bench target; library source needs "always" (coverage
# reports escape-scope-mismatch otherwise).

[[crate_escape]]
crate = "sdk/examples/calculator"
when = "always"
inputs = ["ui/native/src/design.rs", "ui/prototype/tokens.css"]
evidence = ["sdk/examples/calculator/src/render.rs:9", "ui/native/src/design.rs:3"]

[[crate_escape]]
crate = "sdk/examples/calculator"
when = "root"
inputs = ["sdk/examples/system/src/support.rs", "sdk/examples/window-session/src/probe.rs"]
evidence = ["sdk/examples/calculator/src/main.rs:6", "sdk/examples/calculator/src/main.rs:8"]

[[crate_escape]]
crate = "sdk/examples/image-viewer"
when = "root"
inputs = ["services/image-codec/fixtures/**"]
evidence = ["sdk/examples/image-viewer/tests/viewer.rs:7", "sdk/examples/image-viewer/tests/viewer.rs:8"]

[[crate_escape]]
crate = "sdk/examples/image-export"
when = "root"
inputs = ["services/image-codec/fixtures/**"]
evidence = ["sdk/examples/image-export/tests/cli.rs:7", "sdk/examples/image-export/tests/export.rs:4"]

[[crate_escape]]
crate = "services/image-codec/vendor/zune-jpeg-0.5.16-rc3"
# The includes sit in #[cfg(test)] modules of library source. `coverage` cannot see
# cfg(test), so the registration is "always": dependents over-select, never under-select.
when = "always"
inputs = ["services/image-codec/test-images/**"]
evidence = ["services/image-codec/vendor/zune-jpeg-0.5.16-rc3/src/decoder.rs:3666"]

[[crate_escape]]
crate = "crates/capability-core"
when = "root"
inputs = ["kernel/src/m2/m3/window_retirement.rs", "kernel/src/m2/m3/wait.rs"]
evidence = ["crates/capability-core/tests/window_retirement.rs:3", "crates/capability-core/tests/native_wait.rs:3"]

[[crate_escape]]
crate = "services/net-stack"
when = "root"
inputs = ["sdk/examples/tcp-probe/src/contract.rs"]
evidence = ["services/net-stack/tests/conversation.rs:3"]

# Runtime CARGO_MANIFEST_DIR joins (phase 3, limit K5). Both crates are covered by the
# native input set today; the registrations keep them selected if a cargo closure adds them.
[[crate_escape]]
crate = "services/nas/native-volume"
when = "root"
inputs = ["services/nas/native-probe/tests/check_volume_fixture.py"]
evidence = ["services/nas/native-volume/tests/volume.rs:207"]

[[crate_escape]]
crate = "tools/update-tool"
when = "root"
inputs = ["tools/update-keys/**"]
evidence = ["tools/update-tool/tests/roundtrip.rs:305"]

