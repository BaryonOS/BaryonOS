name: Trusted base (merge-hold tools)
description: >-
  Identify the trusted base commit and copy its tools/merge_hold.py and, when it
  exists, tools/ci_impact.py to $RUNNER_TEMP/merge-hold-base. On pull_request the
  base is the first parent of the checked-out merge commit, whose second parent must
  be the pull request head. On merge_group it is T, the merge base of the checked-out
  queue commit and freshly fetched protected main, never merge_group.base_sha
  (ADR-CI-MERGE-GROUP-SELECT-20261126). Any doubt fails the step: no trusted copy of
  the tools could be identified. merge-hold.yml and the merge-group gate share it.
inputs:
  event-name:
    description: github.event_name of the calling run (pull_request or merge_group).
    required: true
  head-sha:
    description: The pull request head (pull_request only).
    default: ''
  merge-group-base-sha:
    description: github.event.merge_group.base_sha (merge_group only).
    default: ''
outputs:
  base-sha:
    description: The trusted base commit the tools were copied from (T on merge_group).
    value: ${{ steps.base.outputs.base-sha }}
  tested-sha:
    description: The checked-out commit (the merge commit or the queue commit).
    value: ${{ steps.base.outputs.tested-sha }}
runs:
  using: composite
  steps:
    - name: Load merge-hold and the selector from the base commit
      id: base
      shell: bash
      env:
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MERGE_GROUP_BASE_SHA: ${{ inputs.merge-group-base-sha }}
      run: |
        set -euo pipefail
        tested="$(git rev-parse HEAD)"
        if [ "$EVENT_NAME" = pull_request ]; then
          # GitHub's merge commit: first parent is the base tip, second the head.
          read -r _ base second extra <<< "$(git rev-list --parents -n 1 HEAD)"
          if [ -n "${extra:-}" ] || [ "${second:-}" != "$HEAD_SHA" ]; then
            echo "::error::The checked-out merge commit does not join the base tip and the pull request head."
            exit 1
          fi
        else
          # T: the merge base of the queue commit and protected main. Any doubt fails closed,
          # because no trusted copy of the tools could be identified.
          main=refs/remotes/origin/main
          if ! git fetch --no-tags --quiet origin "+refs/heads/main:$main"; then
            echo "::error::Could not fetch main; failing closed."
            exit 1
          fi
          base="$(git merge-base "$tested" "$main")" || base=""
          if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]] \
              || ! git merge-base --is-ancestor "$base" "$main" \
              || ! git merge-base --is-ancestor "$base" "$MERGE_GROUP_BASE_SHA" \
              || ! git merge-base --is-ancestor "$MERGE_GROUP_BASE_SHA" "$tested"; then
            echo "::error::The queue commit, merge group base and main do not descend from one main commit; failing closed."
            exit 1
          fi
        fi
        if ! [[ "$base" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::No usable base commit; failing closed."
          exit 1
        fi
        dir="$RUNNER_TEMP/merge-hold-base"
        mkdir -p "$dir"
        git cat-file blob "$base:tools/merge_hold.py" > "$dir/merge_hold.py"
        if git cat-file -e "$base:tools/ci_impact.py" 2> /dev/null; then
          git cat-file blob "$base:tools/ci_impact.py" > "$dir/ci_impact.py"
        fi
        {
          echo "base-sha=$base"
          echo "tested-sha=$tested"
        } >> "$GITHUB_OUTPUT"
