<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" role="img" aria-labelledby="title description">
  <title id="title">Baryon OS: 43% of the fixed product roadmap</title>
  <desc id="description">43 of 100 weighted acceptance points. Zero means no fully accepted criterion; one hundred means a complete independent OS on supported hardware. Assessed on 2026-11-25. Partial implementation is reported separately. Not a time or security score.</desc>
  <defs>
    <radialGradient id="p-space" cx=".18" cy=".45" r=".9"><stop offset="0" stop-color="#121A2C"/><stop offset=".6" stop-color="#090B12"/><stop offset="1" stop-color="#05060A"/></radialGradient>
    <linearGradient id="p-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F6F9"/><stop offset=".55" stop-color="#D7DCE3"/><stop offset="1" stop-color="#A7B0BC"/></linearGradient>
    <filter id="p-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <mask id="p-clear" maskUnits="userSpaceOnUse"><rect x="-10000" y="-10000" width="20000" height="20000" fill="#fff"/><circle cx="436.02" cy="220.99" r="135.80" fill="#000"/><circle cx="800.85" cy="705.13" r="135.80" fill="#000"/><circle cx="199.15" cy="779.01" r="135.80" fill="#000"/></mask>
  </defs>
  <rect width="960" height="256" rx="16" fill="url(#p-space)"/>
  <rect x=".5" y=".5" width="959" height="255" rx="15.5" fill="none" stroke="#232A47"/>
  <circle cx="136" cy="128" r="108" fill="none" stroke="#232A47" stroke-dasharray="2 7"/>
  <circle cx="136" cy="128" r="86" fill="none" stroke="#1A1F38" stroke-width="12"/>
  <circle cx="136" cy="128" r="86" fill="none" stroke="url(#p-silver)" stroke-width="12" stroke-dasharray="232.35 540.35" transform="rotate(-90 136 128)"/>
  <line x1="167.93" y1="195.86" x2="177.30" y2="215.77" stroke="#E6EBF5" stroke-width="3" stroke-linecap="round" filter="url(#p-glow)"/>
  <text x="136" y="142" fill="#EEF1F8" font-family="Inter,system-ui,sans-serif" font-size="44" font-weight="600" text-anchor="middle" font-variant-numeric="tabular-nums">43%</text>
  <text x="136" y="166" fill="#A9B2CB" font-family="Inter,system-ui,sans-serif" font-size="12" text-anchor="middle" letter-spacing="1.5">ACCEPTED</text>
  <g transform="translate(286 30) scale(.026)"><g fill="url(#p-silver)" mask="url(#p-clear)"><path fill-rule="evenodd" d="M444.55,290.47 736.41,677.78 255.05,736.89Z M465.02,457.21 581.77,612.14 389.23,635.78Z"/></g><circle cx="436.02" cy="220.99" r="103.95" fill="#FF4A3D"/><circle cx="800.85" cy="705.13" r="103.95" fill="#2585FF"/><circle cx="199.15" cy="779.01" r="103.95" fill="#33C46B"/></g>
  <text x="324" y="50" fill="#A9B2CB" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" letter-spacing="2">BARYON OS · INDEPENDENT KERNEL · INDEPENDENT PRODUCT</text>
  <text x="286" y="98" fill="#EEF1F8" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="600">From independent kernel to daily-use OS</text>
  <text x="286" y="126" fill="#A9B2CB" font-family="Inter,system-ui,sans-serif" font-size="15">43 / 100 acceptance points · reassessed 2026-11-25</text>
  <rect x="286" y="160" width="626" height="10" rx="5" fill="#1A1F38"/>
  <rect x="286" y="160" width="269.18" height="10" rx="5" fill="#A9B2CB"/>
  <rect x="552.18" y="157" width="3" height="16" rx="1.5" fill="#E6EBF5" filter="url(#p-glow)"/>
  <g fill="#9BA2BC" font-family="Inter,system-ui,sans-serif" font-size="12" text-anchor="middle" font-variant-numeric="tabular-nums"><text x="286.0" y="200">0%</text><text x="442.5" y="200">25%</text><text x="599.0" y="200">50%</text><text x="755.5" y="200">75%</text><text x="912.0" y="200">100%</text></g>
  <text x="286" y="234" fill="#9BA2BC" font-family="Inter,system-ui,sans-serif" font-size="13">No criteria accepted</text>
  <text x="912" y="234" fill="#9BA2BC" font-family="Inter,system-ui,sans-serif" font-size="13" text-anchor="end">Complete independent OS</text>
</svg>
