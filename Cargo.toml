[workspace]
resolver = "2"
members = ["boot/loader", "kernel", "crates/boot-protocol", "crates/elf-loader-core", "crates/kernel-core", "crates/capability-core", "crates/virtio-core", "crates/ui-core", "drivers/virtio-blk", "services/block", "services/objects", "services/catalog", "services/volume"]
exclude = ["experiments/quantum", "ui/prototype"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
