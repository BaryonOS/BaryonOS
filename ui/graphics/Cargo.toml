[package]
name = "nieuw-os-graphics"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
# Draw text::Font from the generated Inter 4.001 atlas instead of Open Sans.
# Swaps the atlas module: the two are never linked together.
inter-atlas = []

[workspace]
resolver = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
