[package]
name = "baryon-ai-candle-oracle"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-only Candle reference that emits golden fixtures for the L01 no_std engine"

[dependencies]
candle-core = { version = "=0.11.1", default-features = false }
candle-nn = { version = "=0.11.1", default-features = false }
candle-transformers = { version = "=0.11.1", default-features = false }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
serde_json = "=1.0.154"

[workspace]
