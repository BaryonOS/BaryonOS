[package]
name = "nieuw-os-network-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
[workspace]
exclude = ["protocol"]
resolver = "3"
[dependencies]
nieuw-os-net-stack = { path = "../net-stack" }
nieuw-os-net-protocol = { path = "../net-protocol" }
nieuw-os-network-protocol = { path = "protocol" }
[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false

[dev-dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-reno",
    "iface-max-addr-count-1", "iface-neighbor-cache-count-4",
    "iface-max-route-count-1", "assembler-max-segment-count-4",
] }
