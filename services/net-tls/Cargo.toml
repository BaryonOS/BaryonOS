[package]
name = "nieuw-os-net-tls"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
b1-provider = ["dep:aes-gcm", "dep:ed25519-dalek", "dep:hmac", "dep:ml-kem", "dep:sha2", "dep:x25519-dalek"]

[dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"], optional = true }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"], optional = true }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"], optional = true }
ml-kem = { version = "=0.3.4", default-features = false, features = ["zeroize"], optional = true }
sha2 = { version = "=0.11.2", default-features = false, features = ["zeroize"], optional = true }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
nieuw-os-sdk-runtime = { path = "../../sdk/runtime" }
nieuw-os-keyring-random-client = { path = "../../sdk/keyring-random-client" }
rustls = { version = "=0.23.46", default-features = false, features = ["custom-provider"] }
spin = { version = "=0.12.3", default-features = false, features = ["mutex", "spin_mutex"] }
zeroize = { version = "=1.9.2", default-features = false }

# Host-only test oracle for N03-T2 (owner decision 2026-11-23). Resolver 2 keeps
# these features out of the library and x86_64-unknown-none graphs.
[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "=0.103.16", default-features = false, features = ["alloc"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }

[workspace]
members = ["."]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
