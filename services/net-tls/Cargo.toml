[package]
name = "nieuw-os-net-tls"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
nieuw-os-sdk-runtime = { path = "../../sdk/runtime" }
nieuw-os-keyring-random-client = { path = "../../sdk/keyring-random-client" }
rustls = { version = "=0.23.46", default-features = false, features = ["custom-provider"] }
spin = { version = "=0.12.3", default-features = false, features = ["mutex", "spin_mutex"] }
zeroize = { version = "=1.9.1", default-features = false }

[workspace]
members = ["."]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
