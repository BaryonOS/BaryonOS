[package]
name = "nieuw-os-net-stack"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-tcp-reno",
    "iface-max-addr-count-1", "iface-neighbor-cache-count-4",
    "iface-max-route-count-1", "assembler-max-segment-count-4",
] }

[workspace]
members = ["."]
resolver = "3"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
