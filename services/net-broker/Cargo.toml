[package]
name = "nieuw-os-net-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
autotests = false

[dependencies]
nieuw-os-net-stack = { path = "../net-stack" }

[dev-dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = [
    "medium-ethernet", "proto-ipv4", "socket-tcp",
] }

[workspace]
members = ["."]
resolver = "3"

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = false
