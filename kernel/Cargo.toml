[package]
name = "os-kernel"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
default = []
test-panic = []
test-hang = []
milestone-m2 = []
native-rtc = ["milestone-m2", "dep:nieuw-os-rtc"]
# H05 step: IF0 M2 profile that ends in a validated ACPI S5 poweroff.
native-acpi-s5 = ["milestone-m2", "dep:nieuw-os-acpi-power"]
test-acpi-s5-corrupt-dsdt = ["native-acpi-s5"]
# K06 step 1: opt-in AP bring-up profile. APs run a bounded sync self-test and
# park; no scheduler, allocator, paging or IPC state is shared with them.
native-smp = ["milestone-m2"]
# Isolated experimental M3/M4 SMP acceptance, not the K06 default.
native-smp-legacy = ["native-smp", "boot-protocol/smp-legacy-wire"]
test-smp-ap-stall = ["native-smp"]
test-smp-ap-mismatch = ["native-smp"]
test-smp-ap-nmi = ["native-smp"]
test-smp-ap-double-fault = ["native-smp"]
test-smp-ap-ipi-deaf = ["native-smp"]
test-smp-ap-shootdown-deaf = ["native-smp"]
test-smp-shootdown-skipped = ["native-smp"]
test-smp-ap-timer-dead = ["native-smp"]
test-smp-lockdep-order = ["native-smp"]
test-smp-spin-irq-off = ["native-smp"]
test-smp-held-across-switch = ["native-smp"]
test-smp-double-run = ["native-smp"]
test-smp-resched-deaf = ["native-smp"]
test-smp-gs-user = ["native-smp"]
test-smp-gs-iret-fault = ["native-smp"]
test-smp-gs-nmi-user = ["native-smp"]
test-smp-shared-scratch = ["native-smp"]
test-smp-lock-in-handler = ["native-smp"]
test-smp-lockpair-order = ["native-smp"]
test-smp-icr-race = ["native-smp"]
test-smp-quarantine-lock-held = ["native-smp"]
test-smp-quarantine-lock-pending = ["native-smp"]
test-smp-quarantine-sched-busy = ["native-smp"]
test-smp-bsp-spin-irq-off = ["native-smp"]
test-smp-proc-shootdown-deaf = ["native-smp"]
test-smp-proc-no-shootdown = ["native-smp"]
# Audit F5/F7: a lock the BSP never frees (STUCK in release), and the
# serial control without the SERIAL lock.
test-smp-lock-stuck = ["native-smp"]
# Structural timing repair (ADR-082): injected defects the progress-bounded
# sync wait and the clock edge accounting must still report.
test-smp-sync-stall = ["native-smp"]
test-smp-sync-slow = ["native-smp"]
test-smp-sync-lost-update = ["native-smp"]
test-smp-clock-masked = ["native-smp"]
test-smp-clock-divisor = ["native-smp"]
test-smp-clock-other-cpu = ["native-smp"]
test-smp-scratch-stall = ["native-smp"]
test-smp-scratch-slow = ["native-smp"]
test-smp-serial-unlocked = ["native-smp"]
# K06 step 5d-2 (R3-1): M3 ring-3 processes on the APs; the only profile in
# which native-smp and milestone-m3 meet.
native-smp-m3 = ["native-smp", "milestone-m3", "fpu-context"]
native-smp-m3-ipc = ["native-smp-m3", "ipc-wait"]
native-smp-m3-migrate = ["native-smp-m3"]
native-smp-m3-kill = ["native-smp-m3"]
native-smp-m3-unmap = ["native-smp-m3"]
test-smp-m3-no-shootdown = ["native-smp-m3-unmap"]
test-smp-m3-recovery = ["native-smp-m3"]
native-smp-m3-load = ["native-smp-m3-ipc"]
native-smp-m3-soak = ["native-smp-m3-load", "test-m4-quotas"]
native-smp-m4-quotas = ["native-smp-m3", "test-m4-quotas"]
native-smp-qsim = ["native-smp-m3", "native-qsim"]
test-smp-m3-canary = ["native-smp-m3-migrate"]
# 5d-2 negative: an app fault on AP2 stops only that process (K03 under SMP).
test-smp-m3-fault = ["native-smp-m3"]
# 5d-2 control: the SMP restore path skips FXRSTOR; the FPU canary must catch it.
test-smp-m3-fpu-skip = ["native-smp-m3"]
framebuffer = ["milestone-m2"]
# Sole display/input transport; UI policy remains in isolated user services.
display-input = ["framebuffer", "milestone-m4", "monotonic-clock", "fpu-context", "dep:nieuw-os-display-client", "dep:nieuw-os-ps2"]
native-display-probe = ["display-input"]
native-system-display-input = ["native-system", "display-input"]
native-system-materiaal = ["native-system-display-input", "ipc-wait"]
native-system-session-preview = ["native-system-materiaal"]
native-window-session = ["native-system-materiaal"]
native-window-session-probe = ["native-window-session"]
native-window-session-hidpi = ["native-window-session"]
native-window-session-hidpi-probe = ["native-window-session-probe", "native-window-session-hidpi"]
# Explicit public VM session route, reusing the existing read-only RTC syscall.
native-session-route = ["native-window-session", "native-system-clock"]
native-system-materiaal-probe = ["native-system-materiaal"]
test-system-materiaal-recover = ["native-system-materiaal-probe", "test-system-recover"]
test-system-materiaal-scale200 = ["native-system-materiaal-probe"]
graphics-g0 = ["framebuffer", "dep:ui-core"]
test-m2-ro = ["milestone-m2"]
test-m2-nx = ["milestone-m2"]
test-m2-absent = ["milestone-m2"]
test-m2-kernel-fault = ["milestone-m2"]
test-m2-double-fault = ["milestone-m2"]
milestone-m3 = ["milestone-m2"]
# Optional 100 Hz boot-monotonic clock; legacy ABI profiles stay unchanged.
monotonic-clock = ["milestone-m3"]
# Optional bounded IPC waits; no legacy profile changes its ABI or idle path.
ipc-wait = ["milestone-m4", "monotonic-clock"]
native-ipc-wait = ["native-sdk-app", "ipc-wait"]
native-tpm-crb = ["native-ipc-wait", "dep:nieuw-os-tpm-crb"]
test-tpm-crb-absent = ["native-tpm-crb"]
# Fallible own-process RW/NX heap suffixes; existing total frame quota.
process-memory = ["monotonic-clock"]
# Separate architecture acceptance fixture; no product bootstrap policy.
native-memory = ["process-memory", "fpu-context"]
native-memory-nx = ["native-memory"]
native-memory-guard = ["native-memory"]
native-memory-peer = ["native-memory"]
native-memory-oom = ["native-memory"]
# M3 SMP scheduler acceptance; FPU/SIMD remains excluded pending per-CPU state.
native-smp-legacy-m3 = ["native-smp-legacy", "milestone-m3"]
native-smp-m3-exit = ["native-smp-legacy-m3", "test-m3-exit"]
native-smp-m3-tlb-reuse = ["native-smp-m3-exit"]
native-smp-m3-lock-contention = ["native-smp-legacy-m3"]
# Capability IPC cross-CPU fixture over the serialized M3 scheduler.
native-smp-m4 = ["native-smp-legacy-m3", "milestone-m4"]
native-smp-m4-revoke = ["native-smp-m4", "test-m4-revoke"]
native-system-random = ["native-system", "monotonic-clock"]
test-system-random-sdk = ["native-system-random"]
test-system-random-unknown = ["native-system-random"]
test-system-random-wrong-caller = ["native-system-random"]
native-system-images = ["native-system", "process-memory", "fpu-context"]
native-system-clock = ["native-system", "monotonic-clock", "dep:nieuw-os-rtc"]
native-system-net-clock = ["native-system-net", "monotonic-clock"]
# Eager per-process x87/SSE state. The fixture is separate from the mechanism.
fpu-context = ["milestone-m3"]
native-fpu = ["fpu-context", "monotonic-clock"]
test-fpu-wait = ["native-fpu", "ipc-wait"]
native-qsim = ["milestone-m3"]
native-qsim-job = ["milestone-m4"]
native-sdk-app = ["milestone-m4"]
test-sdk-app-denied = ["native-sdk-app"]
# K05 process management: supervisor/worker/client ELFs, spawn/kill/status.
native-supervisor = ["milestone-m4"]
test-supervisor-crash = ["native-supervisor"]
test-supervisor-denied = ["native-supervisor"]
test-supervisor-parent-exit = ["native-supervisor"]
test-supervisor-quota = ["native-supervisor"]
test-supervisor-wait = ["native-supervisor", "ipc-wait"]
# K06 5d-2 §4: the six K05 cases on SMP, admitted only through this explicit profile.
native-smp-supervisor = ["native-smp-m3", "native-supervisor"]
test-smp-supervisor-crash = ["native-smp-supervisor", "test-supervisor-crash"]
test-smp-supervisor-denied = ["native-smp-supervisor", "test-supervisor-denied"]
test-smp-supervisor-parent-exit = ["native-smp-supervisor", "test-supervisor-parent-exit"]
test-smp-supervisor-quota = ["native-smp-supervisor", "test-supervisor-quota"]
test-smp-supervisor-wait = ["native-smp-supervisor", "test-supervisor-wait"]
# FR-I01 explicit composed profile; legacy fixture profiles remain separate.
native-cap-digest-bench = ["native-system", "capability-core/diagnostic-bench"]
native-system = ["native-volume", "native-keyring", "native-supervisor"]
test-system-recover = ["native-system"]
# H05 step 2: init's non-delegable POWER capability; S5 only behind the kernel storage gate.
native-system-power = ["native-system", "dep:nieuw-os-acpi-power"]
test-system-power-flush-error = ["native-system-power"]
test-system-power-flush-timeout = ["native-system-power"]
native-system-nas-probe = ["native-system", "monotonic-clock", "ipc-wait"]
test-system-nas-recover = ["native-system-nas-probe", "test-system-recover"]
# Real NIC integration; the base joint profile never probes or maps a NIC.
native-system-net = ["native-system", "dep:virtio-net-driver"]
test-system-net-recover = ["native-system-net", "test-system-recover"]
# Bounded native TCP fixture; protocol processing stays in the ring-3 app.
native-system-tcp = ["native-system-net", "monotonic-clock", "fpu-context"]
# Reusable ring-3 network service and two IPC-only clients; separate manifest.
native-net-service = ["native-system-tcp"]
test-net-service-client-exit = ["native-net-service"]
# N04: a fourth ring-3 policy process revokes one app's live destination grant.
test-net-service-revoke = ["native-net-service"]
# N04: an unregistered helper has only test SEND aliases, never an app grant.
test-net-service-helper = ["native-net-service"]
# N01: actual device-status reset during a published TX, without a new syscall.
test-net-service-device-reset = ["native-net-service", "virtio-net-driver/test-device-reset"]
# The idle owner uses the existing bounded wait ABI; other profiles are unchanged.
test-net-service-exhaustion = ["native-net-service", "ipc-wait"]
test-system-tcp-recover = ["native-system-tcp", "test-system-recover"]
# B01 entropy broker + Key Service profile: virtio-rng broker, two services, one app.
native-keyring = ["milestone-m4", "dep:virtio-rng-driver"]
test-keyring-no-device = ["native-keyring"]
test-keyring-stuck = ["native-keyring"]
test-keyring-timeout = ["native-keyring"]
test-keyring-restart = ["native-keyring"]
test-m3-peer-read = ["milestone-m3"]
test-m3-peer-write = ["milestone-m3"]
test-m3-kernel-write = ["milestone-m3"]
test-m3-stack-exec = ["milestone-m3"]
test-m3-heap-exec = ["milestone-m3"]
test-m3-guard-low = ["milestone-m3"]
test-m3-guard-high = ["milestone-m3"]
test-m3-cli = ["milestone-m3"]
test-m3-x87 = ["milestone-m3"]
test-m3-xmm = ["milestone-m3"]
test-m3-avx = ["milestone-m3"]
test-m3-ud = ["milestone-m3"]
test-m3-exit = ["milestone-m3"]
test-m3-b-exit = ["milestone-m3"]
test-m3-invalid-rsp = ["milestone-m3"]
test-m3-idle = ["milestone-m3"]
test-m3-large-image = ["milestone-m3"]
milestone-m4 = ["milestone-m3"]
test-m4-copy = ["milestone-m4"]
test-m4-wire = ["milestone-m4"]
test-m4-snapshot = ["milestone-m4"]
test-m4-handles = ["milestone-m4"]
test-m4-rights = ["milestone-m4"]
test-m4-revoke = ["milestone-m4"]
test-m4-quotas = ["milestone-m4"]
test-m4-lifecycle = ["milestone-m4"]
milestone-m5 = ["milestone-m4"]
test-m5-service-errors = ["milestone-m5"]
test-m5-device-rights = ["milestone-m5"]
test-m5-async = ["milestone-m5"]
test-m5-bad-descriptor = ["milestone-m5"]
test-m5-used-id = ["milestone-m5"]
test-m5-used-index = ["milestone-m5"]
test-m5-used-short = ["milestone-m5"]
test-m5-used-long = ["milestone-m5"]
test-m5-used-status = ["milestone-m5"]
test-m5-io-error = ["milestone-m5"]
test-m5-timeout = ["milestone-m5"]
test-m5-reset-timeout = ["milestone-m5"]
test-m5-restart = ["milestone-m5"]
test-m5-cpu-mmio = ["milestone-m5"]
test-m5-cpu-dma = ["milestone-m5"]
test-m5-cpu-pci = ["milestone-m5"]
test-m5-no-device = ["milestone-m5"]
milestone-m6a = ["milestone-m5"]
test-m6a-service-errors = ["milestone-m6a"]
test-m6a-device-rights = ["milestone-m6a"]
test-m6a-full = ["milestone-m6a"]
test-m6a-write-error = ["milestone-m6a"]
test-m6a-flush-error = ["milestone-m6a"]
test-m6a-write-timeout = ["milestone-m6a"]
test-m6a-flush-timeout = ["milestone-m6a"]
test-m6a-reset-timeout = ["milestone-m6a"]
test-m6a-no-flush = ["milestone-m6a"]
test-m6a-readonly = ["milestone-m6a"]
test-m6a-bad-descriptor = ["milestone-m6a"]
test-m6a-used-write = ["milestone-m6a"]
test-m6a-used-flush = ["milestone-m6a"]
test-m6a-torn-tail = ["milestone-m6a"]
test-m6a-corrupt-all = ["milestone-m6a"]
test-m6a-stale-generation = ["milestone-m6a"]
test-m6a-no-device = ["milestone-m6a"]
test-m6a-service-cut-1 = ["milestone-m6a"]
test-m6a-service-cut-2 = ["milestone-m6a"]
test-m6a-service-cut-3 = ["milestone-m6a"]
test-m6a-service-cut-4 = ["milestone-m6a"]
test-m6a-service-cut-5 = ["milestone-m6a"]
test-m6a-service-cut-6 = ["milestone-m6a"]
test-m6a-vm-cut-1 = ["milestone-m6a"]
test-m6a-vm-cut-2 = ["milestone-m6a"]
test-m6a-vm-cut-3 = ["milestone-m6a"]
test-m6a-vm-cut-4 = ["milestone-m6a"]
test-m6a-vm-cut-5 = ["milestone-m6a"]
test-m6a-vm-cut-6 = ["milestone-m6a"]
test-m6a-recover = ["milestone-m6a"]

milestone-m6b = ["milestone-m6a", "dep:object-core"]
test-m6b-recover = ["milestone-m6b"]
test-m6b-errors = ["milestone-m6b"]
test-m6b-full = ["milestone-m6b"]
test-m6b-corrupt = ["milestone-m6b"]
test-m6b-vm-cut-before-ack = ["milestone-m6b"]
test-m6b-vm-cut-after-flush = ["milestone-m6b"]
test-m6b-write-error = ["milestone-m6b"]
test-m6b-flush-error = ["milestone-m6b"]
test-m6b-write-timeout = ["milestone-m6b"]
test-m6b-flush-timeout = ["milestone-m6b"]
test-m6b-reset-timeout = ["milestone-m6b"]
test-m6b-write-poll-limit = ["milestone-m6b"]
test-m6b-flush-poll-limit = ["milestone-m6b"]

milestone-m6c = ["milestone-m6b", "dep:catalog-core"]
test-m6c-recover = ["milestone-m6c"]
test-m6c-errors = ["milestone-m6c"]
test-m6c-full = ["milestone-m6c"]
test-m6c-corrupt = ["milestone-m6c"]
test-m6c-legacy = ["milestone-m6c"]
test-m6c-vm-cut-before-rename = ["milestone-m6c"]
test-m6c-vm-cut-after-rename = ["milestone-m6c"]
test-m6c-write-error = ["milestone-m6c"]
test-m6c-flush-error = ["milestone-m6c"]
test-m6c-write-timeout = ["milestone-m6c"]
test-m6c-flush-timeout = ["milestone-m6c"]
test-m6c-reset-timeout = ["milestone-m6c"]
test-m6c-bad-descriptor = ["milestone-m6c"]
test-m6c-used-write = ["milestone-m6c"]
test-m6c-used-flush = ["milestone-m6c"]

# M6e/S04-S05 scalable volume: separate service/app ELFs, generic broker.
native-volume = ["milestone-m6a"]
test-volume-recover = ["native-volume"]
test-volume-cut-data = ["native-volume"]
test-volume-cut-table = ["native-volume"]
test-volume-recover-cut = ["native-volume"]
test-volume-corrupt = ["native-volume"]
test-volume-foreign = ["native-volume"]
test-volume-cut-txn = ["native-volume"]
test-volume-archive-export = ["native-volume"]
test-volume-archive-restore = ["native-volume"]
test-volume-archive-corrupt = ["native-volume"]
test-volume-archive-conflict = ["native-volume"]
test-volume-archive-full = ["native-volume"]

# B03 signed updates: generic broker over the slot store, one ring-3 update
# service; the kernel's own version comes from the build env NOS_IMAGE_VERSION.
native-update = ["milestone-m6a"]
test-update-cut = ["native-update"]
native-update-policy-probe = ["native-update"]

[dependencies]
nieuw-os-tpm-crb = { path = "../drivers/tpm-crb", optional = true }
nieuw-os-rtc = { path = "../drivers/rtc", optional = true }
nieuw-os-acpi-power = { path = "../drivers/acpi-power", optional = true }
nieuw-os-display-client = { path = "../sdk/display-client", default-features = false, optional = true }
nieuw-os-ps2 = { path = "../drivers/ps2", optional = true }
boot-protocol = { path = "../crates/boot-protocol" }
kernel-core = { path = "../crates/kernel-core" }
smp-lock = { path = "../crates/smp-lock" }
capability-core = { path = "../crates/capability-core" }
virtio-core = { path = "../crates/virtio-core" }
virtio-blk-driver = { path = "../drivers/virtio-blk" }
virtio-rng-driver = { path = "../drivers/virtio-rng", optional = true }
virtio-net-driver = { path = "../drivers/virtio-net", optional = true }
block-protocol = { path = "../services/block" }
object-core = { path = "../services/objects", optional = true }
ui-core = { path = "../crates/ui-core", optional = true }
catalog-core = { path = "../services/catalog", optional = true }

[[bin]]
name = "os-kernel"
path = "src/main.rs"
test = false
bench = false
